<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#b9d7fb;font-family:'Noto Sans TC',Arial,sans-serif;color:#111}.wrap{max-width:1180px;margin:0 auto;padding:12px}.card{background:#fff;border-radius:8px;padding:14px;display:grid;grid-template-columns:1fr 175px;gap:14px}.card h2{font-size:22px;margin:0 0 10px}.box{border:1px solid #d8d8d8;border-radius:6px;min-height:112px;padding:12px;font-size:15px;line-height:1.45;white-space:pre-wrap}.actions{display:grid;gap:10px;align-content:start}.badge{justify-self:start;border-radius:999px;background:#ff7a1a;color:#fff;padding:8px 13px;font-size:14px;font-weight:700}.btn{border:1px solid #d8d8d8;border-radius:999px;background:#fff;padding:12px 14px;font-size:15px;font-weight:700;cursor:pointer}.btn.primary{background:#000;color:#fff;border-color:#000}.toast{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:#111;color:#fff;border-radius:999px;padding:8px 12px;opacity:0;transition:.2s}@media(max-width:760px){.card{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><div><h2>可直接使用的指令</h2><div id="prompt" class="box">English:
Review this output using CLEAR. Identify what is complete, what is unclear, what may need verification, what should be adjusted for the audience, and what should be revised before I use it.

繁體中文：
請用 CLEAR 審核這份產出。指出哪些地方完整、哪些地方不清楚、哪些地方可能需要查證、哪些地方需要依對象調整，以及在我使用前應該修正哪些內容。</div></div><div class="actions"><div class="badge">指令已就緒</div><button id="copy" class="btn primary">複製指令</button><button class="btn">我已經會了</button></div></div></div><div id="toast" class="toast">已複製</div><script>document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(document.getElementById('prompt').textContent);let t=document.getElementById('toast');t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1200)}</script></body></html>
