<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>練習器 4.3.1</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #b7d3f8;
      --white: #fff;
      --black: #050505;
      --text: #111;
      --muted: #62666d;
      --border: #d4d4d4;
      --orange: #ff7817;
      --disabled: #b6b6b6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--blue);
      color: var(--text);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      padding: 16px;
      font-size: 16px;
      line-height: 1.5;
    }
    .wrap { width: min(1120px, 100%); margin: 0 auto; }
    .rows { display: grid; gap: 10px; }
    .row {
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr);
      gap: 14px;
      min-height: 108px;
    }
    .label-card {
      background: var(--black);
      color: var(--white);
      border-radius: 8px;
      padding: 18px 18px;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      align-items: center;
      gap: 14px;
    }
    .num {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--white);
      color: var(--black);
      font-size: 18px;
      font-weight: 600;
    }
    .label-card h2 { margin: 0 0 3px; font-size: 20px; line-height: 1.25; font-weight: 600; }
    .label-card p { margin: 0; font-size: 13px; line-height: 1.4; font-weight: 500; }
    .field-card {
      background: var(--white);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
    }
    .field-card label { margin-bottom: 6px; color: var(--muted); font-size: 13px; }
    textarea {
      width: 100%;
      min-height: 70px;
      flex: 1;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      line-height: 1.45;
    }
    textarea:focus-visible, button:focus-visible { outline: 3px solid #2783de; outline-offset: 2px; }
    textarea::placeholder { color: #777; opacity: 1; }
    .output {
      margin-top: 12px;
      padding: 18px 16px 16px;
      background: var(--white);
      border-radius: 8px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 160px;
      gap: 16px;
    }
    .output-main { min-width: 0; }
    .output-head {
      min-height: 40px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .output h1 { margin: 0; font-size: 20px; line-height: 1.3; font-weight: 600; }
    .status {
      flex: 0 0 auto;
      padding: 8px 13px;
      border-radius: 999px;
      background: #eeeeee;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .status.ready { background: var(--orange); color: #fff; }
    .prompt-box {
      min-height: 104px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      white-space: pre-wrap;
      font-size: 15px;
      line-height: 1.5;
    }
    .prompt-box.empty { color: #555; }
    .note { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
    .actions { display: flex; flex-direction: column; gap: 8px; padding-top: 2px; }
    button {
      width: 100%;
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      color: #111;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover:not(:disabled) { filter: brightness(.96); }
    #copyButton { background: #000; color: #fff; border-color: #000; }
    #copyButton:disabled { background: var(--disabled); border-color: var(--disabled); cursor: not-allowed; }
    #copyButton[data-copied="true"] { background: #2f7d52; border-color: #2f7d52; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    @media (max-width: 640px) {
      body { padding: 10px; font-size: 12px; }
      .rows { gap: 8px; }
      .row { grid-template-columns: 118px minmax(0, 1fr); gap: 8px; min-height: 96px; }
      .label-card { padding: 10px 8px; grid-template-columns: 30px minmax(0, 1fr); gap: 7px; }
      .num { width: 30px; height: 30px; font-size: 14px; }
      .label-card h2 { font-size: 14px; }
      .label-card p { font-size: 10px; line-height: 1.3; }
      .field-card { padding: 8px; }
      .field-card label { margin-bottom: 4px; font-size: 10px; }
      textarea { min-height: 66px; padding: 8px; font-size: 12px; }
      .output { padding: 12px; grid-template-columns: minmax(0, 1fr) 120px; gap: 8px; }
      .output-head { align-items: flex-start; gap: 6px; }
      .output h1 { font-size: 14px; }
      .status { padding: 6px 8px; font-size: 9px; }
      .prompt-box { min-height: 130px; padding: 9px; font-size: 11px; line-height: 1.5; }
      .note { font-size: 10px; }
      .actions { gap: 8px; }
      button { min-height: 44px; padding: 7px 8px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="rows" aria-label="建立下一個工作流程提示">
      <div class="row">
        <div class="label-card">
          <span class="num">1</span>
          <div><h2>我的角色</h2><p>描述你的角色。</p></div>
        </div>
        <div class="field-card">
          <label for="role">我的角色</label>
          <textarea id="role" placeholder="範例：專案經理、業務主管、財務分析師、營運經理"></textarea>
        </div>
      </div>
      <div class="row">
        <div class="label-card">
          <span class="num">2</span>
          <div><h2>我經常執行的任務</h2><p>列出你經常完成的重複性任務。</p></div>
        </div>
        <div class="field-card">
          <label for="tasks">我經常執行的任務</label>
          <textarea id="tasks" placeholder="範例：準備每週更新、檢查風險、摘要客戶回饋、撰寫後續追蹤筆記"></textarea>
        </div>
      </div>
      <div class="row">
        <div class="label-card">
          <span class="num">3</span>
          <div><h2>我使用的工具和來源</h2><p>列出你仰賴的系統、工具與資訊來源。</p></div>
        </div>
        <div class="field-card">
          <label for="tools">我使用的工具和來源</label>
          <textarea id="tools" placeholder="範例：電子郵件、試算表、儀表板、CRM、Jira、會議筆記、共用文件"></textarea>
        </div>
      </div>
    </section>

    <section class="output" aria-label="可直接使用的提示">
      <div class="output-main">
        <div class="output-head">
          <h1>可直接使用的提示</h1>
          <span class="status" id="status">完成 3 個部分</span>
        </div>
        <div class="prompt-box empty" id="promptBox">完成三個部分，即可建立你的提示。</div>
        <p class="note">完成後的提示會請 ChatGPT 推薦三個你接下來可以測試的實用代理機器人工作流程。</p>
      </div>
      <aside class="actions" aria-label="提示操作">
        <button id="copyButton" type="button" disabled>複製提示</button>
        <button id="resetButton" type="button">重新填寫</button>
        <button type="button">我已經知道了</button>
        <span class="sr-only" id="copyStatus" aria-live="polite"></span>
      </aside>
    </section>
  </main>

  <script>
    const fields = {
      role: document.getElementById('role'),
      tasks: document.getElementById('tasks'),
      tools: document.getElementById('tools')
    };
    const promptBox = document.getElementById('promptBox');
    const status = document.getElementById('status');
    const copyButton = document.getElementById('copyButton');
    const resetButton = document.getElementById('resetButton');
    const copyStatus = document.getElementById('copyStatus');

    function buildPrompt() {
      const role = fields.role.value.trim();
      const tasks = fields.tasks.value.trim();
      const tools = fields.tools.value.trim();
      const complete = [role, tasks, tools].filter(Boolean).length;

      if (complete < 3) {
        promptBox.textContent = '完成三個部分，即可建立你的提示。';
        promptBox.classList.add('empty');
        status.textContent = `完成 ${3 - complete} 個部分`;
        status.classList.remove('ready');
        copyButton.disabled = true;
        return;
      }

      promptBox.textContent = `請為我推薦下一個適合交給代理機器人的工作流程。\n我的角色：${role}\n我經常執行的任務：${tasks}\n我使用的工具和來源：${tools}\n請推薦 3 個我接下來可以嘗試的實用工作流程。\n針對每一個工作流程，請告訴我：\n－ 為什麼它貼合我的狀況\n－ 它會建立什麼產出\n－ 我需要提供哪些上下文\n請讓建議務實且容易測試。`;
      promptBox.classList.remove('empty');
      status.textContent = '可複製';
      status.classList.add('ready');
      copyButton.disabled = false;
    }

    Object.values(fields).forEach(field => field.addEventListener('input', buildPrompt));

    resetButton.addEventListener('click', () => {
      Object.values(fields).forEach(field => field.value = '');
      copyButton.textContent = '複製提示';
      delete copyButton.dataset.copied;
      buildPrompt();
      fields.role.focus();
    });

    copyButton.addEventListener('click', async () => {
      const text = promptBox.innerText.trim();
      let copied = false;
      try {
        await navigator.clipboard.writeText(text);
        copied = true;
      } catch (_) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try { copied = document.execCommand('copy'); } catch (_) { copied = false; }
        textarea.remove();
      }

      if (copied) {
        copyButton.textContent = '已複製';
        copyButton.dataset.copied = 'true';
        copyStatus.textContent = '提示已複製到剪貼簿。';
        setTimeout(() => {
          copyButton.textContent = '複製提示';
          delete copyButton.dataset.copied;
        }, 1600);
      } else {
        const range = document.createRange();
        range.selectNodeContents(promptBox);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        copyStatus.textContent = '無法自動複製，已選取提示文字，請手動複製。';
        alert('無法自動複製，已為你選取提示文字，請手動複製。');
      }
    });
  </script>
</body>
</html>
