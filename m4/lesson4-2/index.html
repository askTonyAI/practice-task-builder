<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>知識檢核｜補上上下文</title><style>
:root{--bg:#B9D2FF;--card:#fff;--ink:#111;--muted:#4A5568;--ok:#0F7B4F;--bad:#C0392B}*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Noto Sans CJK TC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.5;padding:14px 18px 18px}.wrap{max-width:1120px;margin:0 auto}.labels{display:flex;justify-content:space-between;margin:0 0 8px}.pill{background:var(--ink);color:#fff;border-radius:999px;padding:7px 18px;font-size:14px;font-weight:700}.board{position:relative;display:grid;grid-template-columns:1fr 90px 1fr}.col{display:grid;grid-template-rows:repeat(5,68px);gap:8px}#wires{position:absolute;left:0;top:0;pointer-events:none;z-index:3;overflow:visible}.card{position:relative;z-index:1;touch-action:pan-y;display:flex;align-items:center;width:100%;height:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid transparent;border-radius:12px;padding:7px 16px;cursor:grab;user-select:none;-webkit-user-select:none;transition:background .18s ease,color .18s ease,border-color .16s ease,box-shadow .16s ease}.card.done{cursor:default;background:var(--ink);color:#fff}.card:focus-visible{outline:3px solid #1B3A6B;outline-offset:3px}.card .txt{font-size:15px;line-height:1.32;pointer-events:none}.card.sel,.card.drag{border-color:var(--ink);box-shadow:0 0 0 4px rgba(17,17,17,.14)}.card.target{border-color:var(--ink);box-shadow:0 0 0 6px rgba(17,17,17,.22)}.card.bad{border-color:var(--bad);animation:shake .3s ease}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.dot{position:absolute;top:50%;transform:translateY(-50%);width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--ink)}.card[data-side="L"] .dot{right:-8px}.card[data-side="R"] .dot{left:-8px}.card.done .dot{background:var(--ink);border-color:#fff}.badge{position:absolute;top:6px;right:8px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--ink);display:none;align-items:center;justify-content:center;font-size:12px;font-weight:700}.card.done .badge{display:flex}.card[data-side="L"].done .badge{right:18px}.statusbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:10px}.count{font-size:14px;font-weight:700}.hint{font-size:14px;min-height:20px}.hint.bad{color:var(--bad);font-weight:700}.hint.ok{color:var(--ok);font-weight:700}.actions{display:flex;gap:10px;margin:8px 0 0;flex-wrap:wrap}.btn{font:inherit;font-weight:700;font-size:14px;min-height:38px;padding:7px 22px;border-radius:999px;border:2px solid var(--ink);cursor:pointer;background:var(--ink);color:#fff}.btn.ghost{background:#fff;color:var(--ink)}.answers{margin-top:12px;background:#fff;border-radius:14px;padding:14px 18px}.answers h2{font-size:17px;margin:0 0 10px}.answers ol{margin:0;padding-left:20px}.answers li{margin-bottom:8px}.answers b{display:block}.answers span{color:var(--muted)}[hidden]{display:none!important}@media(max-width:860px){body{padding:12px 8px 18px}.board{grid-template-columns:1fr 48px 1fr}.col{grid-template-rows:repeat(5,92px);gap:7px}.card{padding:9px 11px;border-radius:10px}.card .txt{font-size:13.5px}.pill{font-size:13px;padding:7px 14px}}@media(max-width:560px){body{padding:10px 6px 16px}.board{grid-template-columns:1fr 32px 1fr}.col{grid-template-rows:repeat(5,116px);gap:6px}.card{padding:7px 8px;border-radius:9px}.card .txt{font-size:12px;line-height:1.42}.dot{width:12px;height:12px;border-width:2px}.card[data-side="L"] .dot{right:-7px}.card[data-side="R"] .dot{left:-7px}.badge{width:20px;height:20px;font-size:11px;top:5px;right:6px}.card[data-side="L"].done .badge{right:13px}.btn{padding:7px 16px;font-size:13px}.pill{font-size:12px;padding:6px 12px}}
</style></head><body><div class="wrap"><div class="labels"><span class="pill">情境</span><span class="pill">最佳下一步</span></div><div class="board" id="board"><div class="col" id="left"></div><div></div><div class="col" id="right"></div><svg id="wires" aria-hidden="true"></svg></div><div class="statusbar"><span class="count" id="count">已連對 0 / 5</span><span class="hint" id="hint"></span></div><div class="actions"><button class="btn ghost" id="reset" type="button">重新開始</button><button class="btn" id="reveal" type="button">顯示答案與解析</button></div><div class="answers" id="answers" hidden><h2>正解與理由</h2><ol id="answerList"></ol></div></div><script>
(function(){var SVG_NS="http://www.w3.org/2000/svg";var CIRCLED=["①","②","③","④","⑤"];var PAIRS=[{id:"report",scenario:"你希望 ChatGPT 摘要一份你手上已經有的報告。",step:"上傳或提供那份報告",why:"任務需要依據既有報告內容完成摘要，所以要先把報告提供給 ChatGPT。"},{id:"search",scenario:"你需要來自網路的最新案例，或可信來源中的資訊。",step:"使用搜尋",why:"需要最新案例或可信來源時，應該使用搜尋取得可參考的外部資訊。"},{id:"preference",scenario:"ChatGPT 一直使用對你的工作來說太正式的語氣。",step:"更新你的偏好設定或自訂指令",why:"如果同一種語氣問題一直重複出現，代表偏好設定或自訂指令需要調整。"},{id:"details",scenario:"ChatGPT 給出的回覆很籠統，而且不貼合你的受眾。",step:"在指令中加入這項任務需要的細節",why:"回覆不貼合受眾，通常是任務細節、受眾背景或限制不足，需要在指令中補上。"},{id:"template",scenario:"你希望 ChatGPT 遵循過去某份範本的結構。",step:"提供那份範本作為範例",why:"如果希望產出遵循既有結構，最直接的方法就是把範本作為範例提供給 ChatGPT。"}];var boardEl=document.getElementById("board"),svgEl=document.getElementById("wires"),leftEl=document.getElementById("left"),rightEl=document.getElementById("right"),countEl=document.getElementById("count"),hintEl=document.getElementById("hint"),answersEl=document.getElementById("answers"),answerListEl=document.getElementById("answerList");var matched={},pickedLeft=null,pickedRight=null,drag=null,flash=null;function shuffled(list){var out=list.slice();for(var i=out.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=out[i];out[i]=out[j];out[j]=t}return out}function indexOfPair(id){for(var i=0;i<PAIRS.length;i++){if(PAIRS[i].id===id)return i}return-1}function find(id){var i=indexOfPair(id);return i<0?null:PAIRS[i]}function cardOf(id,side){return(side==="L"?leftEl:rightEl).querySelector('[data-id="'+id+'"]')}function makeCard(id,text,side){var b=document.createElement("button");b.type="button";b.className="card";b.dataset.id=id;b.dataset.side=side;var badge=document.createElement("span");badge.className="badge";var dot=document.createElement("span");dot.className="dot";var t=document.createElement("span");t.className="txt";t.textContent=text;b.appendChild(badge);b.appendChild(dot);b.appendChild(t);b.addEventListener("pointerdown",onPointerDown);b.addEventListener("click",function(e){onClickCard(b,e)});return b}function build(){matched={};pickedLeft=null;pickedRight=null;drag=null;flash=null;leftEl.innerHTML="";rightEl.innerHTML="";answersEl.hidden=true;hintEl.textContent="";hintEl.className="hint";PAIRS.forEach(function(p){leftEl.appendChild(makeCard(p.id,p.scenario,"L"))});shuffled(PAIRS.map(function(p){return p.id})).forEach(function(id){var p=find(id);rightEl.appendChild(makeCard(p.id,p.step,"R"))});updateCount();redraw()}function anchorOf(card,side){var r=card.getBoundingClientRect();var b=boardEl.getBoundingClientRect();return{x:(side==="L"?r.right:r.left)-b.left,y:r.top-b.top+r.height/2}}function pathD(a,z){var mx=(a.x+z.x)/2;return"M "+a.x+" "+a.y+" C "+mx+" "+a.y+", "+mx+" "+z.y+", "+z.x+" "+z.y}function el(name,attrs){var n=document.createElementNS(SVG_NS,name);Object.keys(attrs).forEach(function(k){n.setAttribute(k,attrs[k])});return n}function redraw(){var b=boardEl.getBoundingClientRect();svgEl.setAttribute("width",b.width);svgEl.setAttribute("height",b.height);while(svgEl.firstChild)svgEl.removeChild(svgEl.firstChild);Object.keys(matched).forEach(function(id){var l=cardOf(id,"L"),r=cardOf(id,"R");if(!l||!r)return;var d=pathD(anchorOf(l,"L"),anchorOf(r,"R"));var p=el("path",{d:d,fill:"none",stroke:"#111","stroke-width":"6","stroke-linecap":"round"});svgEl.appendChild(p);var mid=p.getPointAtLength(p.getTotalLength()*.86);svgEl.appendChild(el("circle",{cx:mid.x,cy:mid.y,r:18,fill:"#fff",stroke:"#111","stroke-width":"3"}));svgEl.appendChild(el("path",{d:"M "+(mid.x-8)+" "+mid.y+" L "+(mid.x-2)+" "+(mid.y+6)+" L "+(mid.x+9)+" "+(mid.y-7),fill:"none",stroke:"#111","stroke-width":"3.2","stroke-linecap":"round","stroke-linejoin":"round"}))});if(flash){svgEl.appendChild(el("path",{d:pathD(flash.a,flash.z),fill:"none",stroke:"#C0392B","stroke-width":"5","stroke-linecap":"round","stroke-dasharray":"10 8"}))}if(drag){svgEl.appendChild(el("path",{d:pathD(drag.from,drag.to),fill:"none",stroke:"#111","stroke-width":"5","stroke-linecap":"round","stroke-dasharray":"10 9",opacity:"0.85"}));svgEl.appendChild(el("circle",{cx:drag.to.x,cy:drag.to.y,r:7,fill:"#111"}))}}function pointInBoard(e){var b=boardEl.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}}function onPointerDown(e){var card=e.currentTarget;if(card.classList.contains("done"))return;if(e.pointerType==="mouse"&&e.button!==0)return;clearPick();drag={id:card.dataset.id,side:card.dataset.side,card:card,from:anchorOf(card,card.dataset.side),to:pointInBoard(e),moved:false};card.classList.add("drag");try{card.setPointerCapture(e.pointerId)}catch(err){}card.addEventListener("pointermove",onPointerMove);card.addEventListener("pointerup",onPointerUp);card.addEventListener("pointercancel",onPointerUp);if(e.pointerType==="mouse")e.preventDefault();redraw()}function hoveredCard(e){var node=document.elementFromPoint(e.clientX,e.clientY);return node?node.closest(".card"):null}function onPointerMove(e){if(!drag)return;drag.moved=true;drag.to=pointInBoard(e);var over=hoveredCard(e);Array.prototype.forEach.call(document.querySelectorAll(".card.target"),function(c){c.classList.remove("target")});if(over&&over!==drag.card&&over.dataset.side!==drag.side&&!over.classList.contains("done")){over.classList.add("target")}redraw()}function onPointerUp(e){if(!drag)return;var card=drag.card;card.removeEventListener("pointermove",onPointerMove);card.removeEventListener("pointerup",onPointerUp);card.removeEventListener("pointercancel",onPointerUp);card.classList.remove("drag");Array.prototype.forEach.call(document.querySelectorAll(".card.target"),function(c){c.classList.remove("target")});var target=hoveredCard(e);var d=drag;drag=null;if(!d.moved){redraw();return}if(!target||target===d.card||target.dataset.side===d.side||target.classList.contains("done")){redraw();say("","");return}evaluate(d.side==="L"?d.card:target,d.side==="L"?target:d.card)}function onClickCard(card,e){if(card.classList.contains("done"))return;if(drag)return;var side=card.dataset.side;if(side==="L"){if(pickedLeft)pickedLeft.classList.remove("sel");pickedLeft=card}else{if(pickedRight)pickedRight.classList.remove("sel");pickedRight=card}card.classList.add("sel");if(!pickedLeft||!pickedRight){say(side==="L"?"已選情境，接著點一個「最佳下一步」。":"已選下一步，接著點一個「情境」。","");return}evaluate(pickedLeft,pickedRight)}function evaluate(lCard,rCard){if(lCard.dataset.id===rCard.dataset.id){markDone(lCard.dataset.id);clearPick();updateCount();redraw();if(Object.keys(matched).length<PAIRS.length)say("連對了！","ok")}else{clearPick();flash={a:anchorOf(lCard,"L"),z:anchorOf(rCard,"R")};redraw();[lCard,rCard].forEach(function(c){c.classList.add("bad");setTimeout(function(){c.classList.remove("bad")},320)});say("這條線不對。再想一下：這個情境需要調整、補上下文、查證，還是修改？","bad");setTimeout(function(){flash=null;redraw()},520)}}function markDone(id){matched[id]=true;var n=CIRCLED[indexOfPair(id)];["L","R"].forEach(function(side){var c=cardOf(id,side);if(!c)return;c.classList.remove("sel");c.classList.add("done");c.setAttribute("aria-disabled","true");c.querySelector(".badge").textContent=n})}function clearPick(){Array.prototype.forEach.call(document.querySelectorAll(".card.sel"),function(c){c.classList.remove("sel")});pickedLeft=null;pickedRight=null}function say(text,kind){hintEl.textContent=text;hintEl.className="hint"+(kind?" "+kind:"")}function updateCount(){var done=Object.keys(matched).length;countEl.textContent="已連對 "+done+" / "+PAIRS.length;if(done===PAIRS.length){say("全部連對完成！往下看解析，確認你的理由跟答案一致。","ok");renderAnswers()}}function renderAnswers(){answerListEl.innerHTML="";PAIRS.forEach(function(p){var li=document.createElement("li");var b=document.createElement("b");b.textContent=p.scenario+" → "+p.step;var s=document.createElement("span");s.textContent=p.why;li.appendChild(b);li.appendChild(s);answerListEl.appendChild(li)});answersEl.hidden=false}function revealAll(){PAIRS.forEach(function(p){if(!matched[p.id])markDone(p.id)});clearPick();updateCount();redraw();renderAnswers()}document.getElementById("reset").addEventListener("click",build);document.getElementById("reveal").addEventListener("click",revealAll);window.addEventListener("resize",redraw);if(window.ResizeObserver){new ResizeObserver(redraw).observe(boardEl)}build();})();
</script></body></html>
