<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>練習：使用檔案｜指令產生器</title>
<style>
  :root { --bg:#B9D2FF; --ink:#111111; --muted:#5A6472; --line:#D7DCE5; --ok:#0F7B4F; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:"Noto Sans TC","Noto Sans CJK TC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif; font-size:16px; line-height:1.5; padding:18px 18px 30px; }
  .wrap { max-width:1080px; margin:0 auto; }
  .row { display:grid; grid-template-columns:268px 1fr; gap:14px; margin-bottom:8px; }
  .label { background:var(--ink); color:#fff; border-radius:14px; padding:12px 16px; display:flex; align-items:center; gap:13px; }
  .num { flex:0 0 auto; width:32px; height:32px; border-radius:50%; background:#fff; color:var(--ink); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; }
  .label b { display:block; font-size:17px; line-height:1.25; }
  .label span { display:block; font-size:12.5px; line-height:1.35; color:#C9D3E2; margin-top:3px; }
  .field { background:#fff; border-radius:14px; padding:11px 14px 13px; }
  .field > span { display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; }
  .sourcegrid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .sourcebtn { font:inherit; text-align:left; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-height:72px; cursor:pointer; }
  .sourcebtn b { display:block; font-size:15px; margin-bottom:3px; }
  .sourcebtn span { display:block; font-size:12.5px; line-height:1.35; color:var(--muted); }
  .sourcebtn.active { background:var(--ink); color:#fff; border-color:var(--ink); box-shadow:0 0 0 3px rgba(17,17,17,.18); }
  .sourcebtn.active span { color:#C9D3E2; }
  .sourcebtn:focus-visible, .btn:focus-visible, textarea:focus-visible { outline:3px solid #1B3A6B; outline-offset:2px; }
  .field textarea { width:100%; font:inherit; font-size:15px; color:var(--ink); border:2px solid var(--ink); border-radius:10px; padding:9px 12px; background:#fff; resize:vertical; min-height:64px; }
  .field textarea::placeholder { color:#8B93A1; }
  .out { background:#fff; border-radius:16px; padding:16px 18px; margin-top:4px; display:grid; grid-template-columns:1fr 200px; gap:18px; }
  .out h2 { font-size:19px; margin:0 0 10px; }
  .promptbox { border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-height:88px; font-size:15px; line-height:1.6; white-space:pre-wrap; color:var(--ink); }
  .promptbox.empty { color:#8B93A1; }
  .note { font-size:13px; color:var(--muted); margin:9px 0 0; }
  .side { display:flex; flex-direction:column; gap:9px; }
  .pill { align-self:flex-start; background:#EFF2F7; color:var(--ink); border-radius:999px; padding:6px 14px; font-size:13.5px; font-weight:700; }
  .pill.done { background:#DDF3E7; color:var(--ok); }
  .btn { font:inherit; font-weight:700; font-size:15px; min-height:42px; padding:9px 18px; border-radius:999px; border:2px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; }
  .btn.ghost { background:#fff; color:var(--ink); }
  .btn[disabled] { background:#A8AEB8; border-color:#A8AEB8; color:#fff; cursor:default; }
  .msg { font-size:13.5px; min-height:20px; font-weight:700; color:var(--ok); }
  @media (max-width:820px) { body{padding:14px 12px 26px;} .row{grid-template-columns:168px 1fr; gap:10px;} .label{padding:10px 12px; gap:9px; border-radius:12px;} .num{width:26px;height:26px;font-size:13px;} .label b{font-size:14.5px;} .label span{font-size:11.5px;} .field{padding:9px 11px 11px;border-radius:12px;} .field textarea{font-size:14px;padding:8px 10px;min-height:64px;} .sourcegrid{gap:7px;} .sourcebtn{padding:8px 9px;min-height:70px;} .sourcebtn b{font-size:14px;} .sourcebtn span{font-size:11.5px;} .out{grid-template-columns:1fr;gap:12px;padding:14px;} .side{flex-direction:row;flex-wrap:wrap;align-items:center;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div class="label"><div class="num">1</div><div><b>選擇來源類型</b><span>選擇 ChatGPT 應該把哪一種內容當作來源素材。</span></div></div>
    <div class="field">
      <span>來源類型</span>
      <div class="sourcegrid" role="group" aria-label="來源類型">
        <button class="sourcebtn" type="button" data-type="file"><b>檔案</b><span>你上傳或附加的檔案。</span></button>
        <button class="sourcebtn" type="button" data-type="document"><b>文件</b><span>文件、報告或其他文字素材。</span></button>
        <button class="sourcebtn" type="button" data-type="source"><b>來源</b><span>來源、文章、頁面或參考資料。</span></button>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="label"><div class="num">2</div><div><b>需要擷取什麼？</b><span>清楚告訴 ChatGPT 你要它抓出哪些重點。</span></div></div>
    <div class="field"><span>你需要擷取的內容</span><textarea id="extract" placeholder="範例：關鍵風險、行動項目、期限、決策、有用引文，以及任何需要確認的內容"></textarea></div>
  </div>
  <div class="row">
    <div class="label"><div class="num">3</div><div><b>指定受眾</b><span>這份摘要是要給誰看的？</span></div></div>
    <div class="field"><span>受眾</span><textarea id="audience" placeholder="範例：高階主管、新進同事、專案團隊、客戶，或我的主管"></textarea></div>
  </div>
  <div class="out">
    <div>
      <h2>可直接使用的指令</h2>
      <div class="promptbox empty" id="promptBox">選擇來源類型，並填寫兩個文字欄位，就能產生你的指令。</div>
      <p class="note">完成後的指令會要求 ChatGPT 摘要來源素材、擷取你需要的細節，並標出在採用摘要前應該再檢查的地方。</p>
    </div>
    <div class="side">
      <span class="pill" id="pill">已填 0／3</span>
      <button class="btn" id="copy" type="button" disabled>複製指令</button>
      <button class="btn ghost" id="reset" type="button">清空重填</button>
      <button class="btn ghost" id="demo" type="button">看示範填答</button>
      <span class="msg" id="msg"></span>
    </div>
  </div>
</div>
<script>
(function(){
  var sourceType = "";
  var labels = { file:"檔案", document:"文件", source:"來源" };
  var sourceBtns = Array.prototype.slice.call(document.querySelectorAll(".sourcebtn"));
  var extractEl = document.getElementById("extract");
  var audienceEl = document.getElementById("audience");
  var boxEl = document.getElementById("promptBox");
  var pillEl = document.getElementById("pill");
  var copyBtn = document.getElementById("copy");
  var resetBtn = document.getElementById("reset");
  var demoBtn = document.getElementById("demo");
  var msgEl = document.getElementById("msg");
  function clean(v){ return (v || "").trim(); }
  function count(){ return (sourceType ? 1 : 0) + (clean(extractEl.value) ? 1 : 0) + (clean(audienceEl.value) ? 1 : 0); }
  function buildPrompt(){
    var parts = [];
    if(sourceType) parts.push("請把這份" + labels[sourceType] + "當作來源素材。");
    if(clean(audienceEl.value)) parts.push("請為「" + clean(audienceEl.value) + "」摘要最重要的重點。");
    if(clean(extractEl.value)) parts.push("請包含「" + clean(extractEl.value) + "」。");
    if(parts.length) parts.push("並告訴我在採用這份摘要前，應該先檢查哪些地方。");
    return parts.join("");
  }
  function update(){
    var filled = count();
    var ready = filled === 3;
    pillEl.textContent = "已填 " + filled + "／3";
    pillEl.classList.toggle("done", ready);
    copyBtn.disabled = !ready;
    var prompt = buildPrompt();
    if(prompt){ boxEl.textContent = prompt; boxEl.classList.remove("empty"); }
    else { boxEl.textContent = "選擇來源類型，並填寫兩個文字欄位，就能產生你的指令。"; boxEl.classList.add("empty"); }
    msgEl.textContent = "";
  }
  sourceBtns.forEach(function(btn){ btn.addEventListener("click", function(){ sourceType = btn.dataset.type; sourceBtns.forEach(function(b){ b.classList.toggle("active", b === btn); }); update(); }); });
  extractEl.addEventListener("input", update);
  audienceEl.addEventListener("input", update);
  copyBtn.addEventListener("click", function(){ if(copyBtn.disabled) return; navigator.clipboard && navigator.clipboard.writeText(boxEl.textContent); msgEl.textContent = "已複製"; });
  resetBtn.addEventListener("click", function(){ sourceType = ""; extractEl.value = ""; audienceEl.value = ""; sourceBtns.forEach(function(b){ b.classList.remove("active"); }); update(); });
  demoBtn.addEventListener("click", function(){ sourceType = "file"; extractEl.value = "關鍵風險"; audienceEl.value = "高階主管"; sourceBtns.forEach(function(b){ b.classList.toggle("active", b.dataset.type === sourceType); }); update(); });
  update();
})();
</script>
</body>
</html>
