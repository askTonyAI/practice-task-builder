<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>互動圖 4.5.1</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:"Noto Sans TC","Noto Sans CJK TC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;background:linear-gradient(130deg,#ba58c8 0%,#76b8e8 48%,#00a7c6 100%);min-height:100vh;padding:42px 54px;color:#050505}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:1360px;margin:0 auto;align-items:start}.card{position:relative;background:#fff;border-radius:7px;min-height:260px;padding:68px 28px 24px;overflow:visible}.tab{position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:#000;color:#fff;border-radius:999px;padding:10px 28px;font-size:30px;font-weight:800;line-height:1;white-space:nowrap}.icon{height:132px;display:flex;align-items:center;justify-content:center}.icon svg{width:86px;height:86px;stroke:#000;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}.arrow{position:absolute;left:50%;bottom:-28px;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;border:0;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}.arrow svg{width:28px;height:28px;stroke:#fff;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:.18s}.card.open .arrow svg{transform:rotate(180deg)}.details{display:none;margin-top:20px}.card.open{min-height:620px}.card.open .details{display:grid;gap:16px}.info{border:3px solid #000;border-radius:16px;min-height:112px;padding:18px;display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:center}.info.black{background:#000;color:#fff;min-height:86px}.mini svg{width:42px;height:42px;stroke:currentColor;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.info b{display:block;font-size:20px;line-height:1.1;margin-bottom:3px}.info span{display:block;font-size:19px;line-height:1.22}.info.black b{margin:0;font-size:19px}@media(max-width:900px){body{padding:34px 10px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start}.card{min-height:180px;padding:44px 10px 18px}.card.open{min-height:500px}.tab{font-size:18px;padding:8px 14px;top:-18px}.icon{height:92px}.icon svg{width:54px;height:54px;stroke-width:7}.arrow{width:38px;height:38px;bottom:-20px}.arrow svg{width:21px;height:21px}.details{margin-top:12px}.card.open .details{gap:10px}.info{grid-template-columns:34px 1fr;gap:8px;min-height:94px;padding:10px 8px;border-radius:12px;border-width:2px}.mini svg{width:28px;height:28px}.info b{font-size:14px}.info span{font-size:13px;line-height:1.25}.info.black{min-height:58px}.info.black b{font-size:13px}}@media(max-width:520px){body{padding:32px 6px}.grid{gap:7px}.card{padding-left:6px;padding-right:6px}.tab{font-size:15px;padding:7px 10px}.info{grid-template-columns:1fr}.mini{display:none}.info b{font-size:12px}.info span{font-size:11px}.info.black b{font-size:11px}}</style></head><body><div class="grid"><div class="card"><div class="tab">輸入</div><div class="icon"><svg viewBox="0 0 100 100"><path d="M24 72V28c0-4 3-7 7-7h22"/><path d="M36 64l9-3 34-34a10 10 0 0 0-14-14L31 47l-3 9z"/><path d="M72 50v22c0 4-3 7-7 7H31c-4 0-7-3-7-7"/></svg></div><button class="arrow" aria-label="展開輸入"><svg viewBox="0 0 40 40"><path d="M10 16l10 10 10-10"/></svg></button><div class="details"><div class="info"><div class="mini"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="19"/><circle cx="25" cy="20" r="6"/><path d="M13 39c3-9 21-9 24 0"/></svg></div><div><b>定義</b><span>ChatGPT 可以在一次對話中使用的資訊</span></div></div><div class="info"><div class="mini"><svg viewBox="0 0 50 50"><path d="M10 14h30v20H22L11 41l2-7h-3z"/></svg></div><div><b>範例</b><span>一段指令、檔案、筆記或會議逐字稿</span></div></div><div class="info black"><div class="mini"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="18"/><circle cx="25" cy="25" r="10"/><circle cx="25" cy="25" r="3"/></svg></div><b>最適合單次任務</b></div></div></div><div class="card"><div class="tab">自訂指令</div><div class="icon"><svg viewBox="0 0 100 100"><path d="M20 34h60"/><circle cx="58" cy="34" r="12"/><path d="M20 66h60"/><circle cx="42" cy="66" r="12"/></svg></div><button class="arrow" aria-label="展開自訂指令"><svg viewBox="0 0 40 40"><path d="M10 16l10 10 10-10"/></svg></button><div class="details"><div class="info"><div class="mini"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="19"/><circle cx="25" cy="20" r="6"/><path d="M13 39c3-9 21-9 24 0"/></svg></div><div><b>定義</b><span>你希望 ChatGPT 如何回應、採用什麼工作方式</span></div></div><div class="info"><div class="mini"><svg viewBox="0 0 50 50"><path d="M10 14h30v20H22L11 41l2-7h-3z"/></svg></div><div><b>範例</b><span>保持專業、簡潔，並且容易理解</span></div></div><div class="info black"><div class="mini"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="18"/><circle cx="25" cy="25" r="10"/><circle cx="25" cy="25" r="3"/></svg></div><b>最適合反覆出現的偏好</b></div></div></div><div class="card"><div class="tab">記憶</div><div class="icon"><svg viewBox="0 0 100 100"><path d="M50 18c-10-10-27-3-25 12-11 3-14 17-6 25-8 12 2 28 17 27 5 10 19 10 25 1 14 4 27-7 24-22 10-8 7-25-5-30 1-14-18-24-30-13z"/><path d="M50 18v64"/><path d="M35 28c-7 4-9 13-4 19"/><path d="M34 58c-5 5-4 13 2 18"/><path d="M65 29c7 4 9 13 4 19"/><path d="M66 58c5 5 4 13-2 18"/><path d="M38 45c4-3 9-3 12 1"/><path d="M62 45c-4-3-9-3-12 1"/></svg></div><button class="arrow" aria-label="展開記憶"><svg viewBox="0 0 40 40"><path d="M10 16l10 10 10-10"/></svg></button><div class="details"><div class="info"><div class="mini"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="19"/><circle cx="25" cy="20" r="6"/><path d="M13 39c3-9 21-9 24 0"/></svg></div><div><b>定義</b><span>ChatGPT 可以為未來對話記住的資訊</span></div></div><div class="info"><div class="mini"><svg viewBox="0 0 50 50"><path d="M10 14h30v20H22L11 41l2-7h-3z"/></svg></div><div><b>範例</b><span>你的角色、目前專案，或偏好的寫作風格</span></div></div><div class="info black"><div class="mini"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="18"/><circle cx="25" cy="25" r="10"/><circle cx="25" cy="25" r="3"/></svg></div><b>最適合持續使用的上下文</b></div></div></div></div><script>document.querySelectorAll('.arrow').forEach(function(b){b.addEventListener('click',function(){b.closest('.card').classList.toggle('open')})});</script></body></html>
