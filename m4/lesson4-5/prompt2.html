<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>練習：儲存有用偏好</title><style>
:root{--bg:#B9D2FF;--ink:#111;--muted:#5A6472;--line:#D7DCE5;--ok:#ff7a1a}*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Noto Sans CJK TC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.5;padding:18px}.wrap{max-width:1080px;margin:0 auto}.out{background:#fff;border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:1fr 200px;gap:18px}.out h2{font-size:19px;margin:0 0 10px}.promptbox{border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:88px;font-size:15px;line-height:1.6;color:var(--ink)}.side{display:flex;flex-direction:column;gap:9px}.pill{align-self:flex-start;background:#ff7a1a;color:#fff;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:700}.btn{font:inherit;font-weight:700;font-size:15px;min-height:42px;padding:9px 18px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}.btn.ghost{background:#fff;color:var(--ink)}.msg{font-size:13.5px;min-height:20px;font-weight:700;color:#0F7B4F}@media(max-width:820px){body{padding:14px 12px 26px}.out{grid-template-columns:1fr;gap:12px;padding:14px}.side{flex-direction:row;flex-wrap:wrap;align-items:center}}</style></head>
<body><div class="wrap"><div class="out"><div><h2>可直接使用的指令</h2><div class="promptbox" id="promptBox">根據我的工作方式，建議一組簡短的自訂指令，讓我可以使用。請先問我兩個問題，讓你的建議更貼近我的狀況。</div></div><div class="side"><span class="pill">指令已準備好</span><button class="btn" id="copy" type="button">複製指令</button><button class="btn ghost" id="done" type="button">我已經會了</button><span class="msg" id="msg"></span></div></div></div><script>
var copyBtn=document.getElementById('copy');
var msg=document.getElementById('msg');
var promptBox=document.getElementById('promptBox');
function setMsg(text,ok){msg.textContent=text;msg.style.color=ok?'#0F7B4F':'#B42318'}
function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text;
  ta.setAttribute('readonly','');
  ta.style.position='fixed';
  ta.style.top='-9999px';
  ta.style.left='-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  var success=false;
  try{success=document.execCommand('copy')}catch(e){success=false}
  document.body.removeChild(ta);
  return success;
}
async function copyPrompt(){
  var text=promptBox.textContent.trim();
  var copied=false;
  try{
    if(navigator.clipboard&&window.isSecureContext){
      await navigator.clipboard.writeText(text);
      copied=true;
    }else{
      copied=fallbackCopy(text);
    }
  }catch(e){
    copied=fallbackCopy(text);
  }
  if(copied){
    setMsg('已複製',true);
    copyBtn.textContent='已複製';
    setTimeout(function(){copyBtn.textContent='複製指令';},1400);
  }else{
    setMsg('無法自動複製，請手動選取文字複製',false);
    promptBox.setAttribute('tabindex','0');
    var range=document.createRange();
    range.selectNodeContents(promptBox);
    var sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
}
copyBtn.addEventListener('click',copyPrompt);
</script></body></html>
