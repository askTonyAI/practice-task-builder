<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>課程成果翻面卡片</title>
<style>
:root{--ink:#080808;--line:#dedede;--bg:#fafafa}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans TC","Noto Sans CJK TC",Arial,sans-serif;background:var(--bg);color:var(--ink)}body{padding:22px}.grid{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 58px}.card{position:relative;min-height:390px;perspective:1200px;cursor:pointer;border:0;background:transparent;padding:0;text-align:inherit}.inner{position:absolute;inset:0;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}.card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 10px 24px rgba(0,0,0,.04);padding:36px 34px;display:flex;flex-direction:column;align-items:center;justify-content:center}.back{transform:rotateY(180deg);align-items:flex-start}.flip{position:absolute;top:18px;right:20px;z-index:4;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:24px;font-weight:700;line-height:1}.icon{width:100px;height:100px;margin-bottom:20px}.num{width:44px;height:44px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-size:20px;font-weight:800;margin-bottom:18px}.front h2{font-size:24px;line-height:1.25;text-align:center;margin:0;font-weight:800}.back p{font-size:20px;line-height:1.5;font-weight:750;margin:0;max-width:94%}.card:focus-visible{outline:4px solid #2783de;outline-offset:6px}@media(max-width:760px){body{padding:12px}.grid{grid-template-columns:1fr;gap:16px}.card{min-height:330px}.face{padding:30px 24px}.icon{width:86px;height:86px;margin-bottom:16px}.num{width:38px;height:38px;font-size:18px;margin-bottom:14px}.front h2{font-size:21px}.back p{font-size:17px;line-height:1.5}}@media(prefers-reduced-motion:reduce){.inner{transition:none}}
</style>
</head>
<body>
<main class="grid" aria-label="四項課程成果翻面卡片">
<button class="card" type="button" aria-pressed="false"><span class="flip" aria-hidden="true">⟳</span><span class="inner"><span class="face front"><svg class="icon" viewBox="0 0 140 140" aria-hidden="true"><circle cx="60" cy="58" r="42" fill="none" stroke="#000" stroke-width="10"/><path d="M90 89l30 30" stroke="#000" stroke-width="11" stroke-linecap="round"/><g fill="#000"><circle cx="48" cy="46" r="6"/><circle cx="66" cy="46" r="6"/><circle cx="84" cy="46" r="6"/><circle cx="48" cy="64" r="6"/><circle cx="66" cy="64" r="6"/><circle cx="84" cy="64" r="6"/><circle cx="48" cy="82" r="6"/><circle cx="66" cy="82" r="6"/><circle cx="84" cy="82" r="6"/></g></svg><span class="num">1</span><h2>範圍界定說明</h2></span><span class="face back"><p>這份文件定義你要支援的週期性會議或工作流程、服務對象、使用的輸入資料、支援的決策，以及成功的樣貌。</p></span></span></button>
<button class="card" type="button" aria-pressed="false"><span class="flip" aria-hidden="true">⟳</span><span class="inner"><span class="face front"><svg class="icon" viewBox="0 0 140 140" aria-hidden="true"><g fill="none" stroke="#000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><circle cx="70" cy="28" r="18"/><circle cx="35" cy="104" r="18"/><circle cx="105" cy="104" r="18"/><path d="M70 46v25M35 86V74q0-12 12-12h46q12 0 12 12v12"/></g></svg><span class="num">2</span><h2>功能地圖</h2></span><span class="face back"><p>這份文件顯示 ChatGPT 的哪些功能在工作流程各階段最實用，以及原因。</p></span></span></button>
<button class="card" type="button" aria-pressed="false"><span class="flip" aria-hidden="true">⟳</span><span class="inner"><span class="face front"><svg class="icon" viewBox="0 0 140 140" aria-hidden="true"><g fill="none" stroke="#000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M24 70q28-8 37-38 8 30 37 38-29 8-37 38-9-30-37-38z"/><path d="M83 30q14-4 18-18 4 14 18 18-14 4-18 18-4-14-18-18zM88 103q12-3 15-15 3 12 15 15-12 3-15 15-3-12-15-15z"/></g></svg><span class="num">3</span><h2>最終 AI 工作流程計畫</h2></span><span class="face back"><p>這是你的逐步作業流程，用來準備、審核、分析並製作週期性工作所需的產出。</p></span></span></button>
<button class="card" type="button" aria-pressed="false"><span class="flip" aria-hidden="true">⟳</span><span class="inner"><span class="face front"><svg class="icon" viewBox="0 0 140 140" aria-hidden="true"><g fill="none" stroke="#000" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M36 24h68q10 0 10 10v10M36 24q-10 0-10 10v74q0 10 10 10h68q10 0 10-10v-6"/><path d="M43 55l9 9 16-18M43 88l9 9 16-18M79 60h25M79 93h25"/></g></svg><span class="num">4</span><h2>可重複使用的檢查清單</h2></span><span class="face back"><p>這份清單可協助你一致地執行工作流程、套用正確功能，並在分享產出或採取行動前驗證重要結果。</p></span></span></button>
</main>
<script>
document.querySelectorAll('.card').forEach(function(card){function toggle(){var f=card.classList.toggle('flipped');card.setAttribute('aria-pressed',String(f))}card.addEventListener('click',toggle);card.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}})});
</script>
</body></html>
