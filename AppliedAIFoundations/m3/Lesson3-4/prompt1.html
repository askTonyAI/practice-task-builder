<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#b9d7fb;font-family:'Noto Sans TC',Arial,sans-serif;color:#111}.app{max-width:1180px;margin:0 auto;padding:12px}.panel{background:#fff;border-radius:8px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{border:1px solid #e1e1e1;border-radius:7px;padding:10px;background:#fff}.field.wide{grid-column:1/3}.head{display:flex;gap:8px;align-items:baseline;margin-bottom:7px}.num{width:24px;height:24px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700;flex:0 0 24px}.title{font-size:16px;font-weight:800}.hint{font-size:13px;color:#555;margin-left:auto}textarea,input{width:100%;border:1px solid #d8d8d8;border-radius:6px;padding:10px 11px;font:15px/1.4 'Noto Sans TC',Arial,sans-serif;resize:vertical}input{height:42px}textarea{min-height:68px}.details textarea{min-height:80px}.output{margin-top:10px;background:#fff;border-radius:8px;padding:14px;display:grid;grid-template-columns:1fr 175px;gap:14px}.output h2{font-size:22px;margin:0 0 10px}.box{border:1px solid #d8d8d8;border-radius:6px;min-height:132px;padding:12px;font-size:15px;line-height:1.45;white-space:pre-wrap}.foot{font-size:13px;color:#555;margin-top:8px}.actions{display:grid;gap:10px;align-content:start}.badge{justify-self:start;border-radius:999px;background:#eee;padding:8px 13px;font-size:14px;font-weight:700}.badge.ready{background:#ff7a1a;color:#fff}.btn{border:1px solid #d8d8d8;border-radius:999px;background:#fff;padding:12px 14px;font-size:15px;font-weight:700;cursor:pointer}.btn.primary{background:#000;color:#fff;border-color:#000}.btn:disabled{background:#aaa;border-color:#aaa}.toast{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:#111;color:#fff;border-radius:999px;padding:8px 12px;opacity:0;transition:.2s}@media(max-width:760px){.panel,.output{grid-template-columns:1fr}.field.wide{grid-column:auto}.hint{margin-left:0}.head{flex-wrap:wrap}}</style></head><body><div class="app"><div class="panel"><div class="field"><div class="head"><span class="num">1</span><span class="title">描述任務</span><span class="hint">你想練習什麼？</span></div><textarea id="task" placeholder="在這裡填入你想要敘述的 Task"></textarea></div><div class="field"><div class="head"><span class="num">2</span><span class="title">設定目標</span><span class="hint">想達成什麼？</span></div><input id="goal" placeholder="在這裡填入你設定的目標"></div><div class="field"><div class="head"><span class="num">3</span><span class="title">選擇對象</span><span class="hint">寫給誰看？</span></div><input id="audience" placeholder="在這裡填入你設定的目標對象"></div><div class="field"><div class="head"><span class="num">4</span><span class="title">使用情境</span><span class="hint">會用在哪裡？</span></div><input id="use" placeholder="在這裡填入使用情境"></div><div class="field wide details"><div class="head"><span class="num">5</span><span class="title">具體細節</span><span class="hint">段落、要求或重點</span></div><textarea id="details" placeholder="在這裡填入特殊規格"></textarea></div></div><div class="output"><div><h2>可直接使用的指令</h2><div id="prompt" class="box">請在上方欄位輸入內容，建立你的指令。</div><div class="foot">你填了哪些欄位，指令就會即時加入哪些內容。</div></div><div class="actions"><div id="status" class="badge">尚未輸入</div><button id="copy" class="btn primary" disabled>複製指令</button><button id="reset" class="btn">重設</button><button class="btn">我已經會了</button></div></div></div><div id="toast" class="toast">已複製</div><script>const ids=['task','goal','audience','use','details'],els=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));function build(){const v=Object.fromEntries(ids.map(id=>[id,els[id].value.trim()]));const filled=ids.filter(id=>v[id]).length;const enParts=[],zhParts=[];if(v.task){enParts.push(`Help me with my practice task: ${v.task}.`);zhParts.push(`請協助我完成這個練習任務：${v.task}。`)}if(v.goal){enParts.push(`The goal is ${v.goal}.`);zhParts.push(`目標是：${v.goal}。`)}if(v.audience){enParts.push(`The audience is ${v.audience}.`);zhParts.push(`目標對象是：${v.audience}。`)}if(v.use){enParts.push(`The output should help me ${v.use}.`);zhParts.push(`這份產出應該幫助我：${v.use}。`)}if(v.details){enParts.push(`Include ${v.details}.`);zhParts.push(`請包含：${v.details}。`)}if(filled>0){enParts.push('Ask me for anything important that is missing before finalizing.');zhParts.push('在完成之前，如果有任何重要資訊缺漏，請先詢問我。')}document.getElementById('prompt').textContent=filled?`English:\n${enParts.join(' ')}\n\n繁體中文：\n${zhParts.join('')}`:'請在上方欄位輸入內容，建立你的指令。';document.getElementById('copy').disabled=!filled;document.getElementById('status').className='badge'+(filled?' ready':'');document.getElementById('status').textContent=filled?`已填 ${filled} 個部分`:'尚未輸入'}ids.forEach(id=>els[id].addEventListener('input',build));document.getElementById('reset').onclick=()=>{ids.forEach(id=>els[id].value='');build()};document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(document.getElementById('prompt').textContent);let t=document.getElementById('toast');t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1200)}</script></body></html>
