<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>練習 1.4.2｜找出可以交給 AI 工作流程的環節</title>
<style>
:root{--bg:#B9D2FF;--ink:#111;--muted:#5A6472;--line:#D7DCE5;--ok:#0F7B4F;--warn:#FF7A1A;--error:#C62828}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Noto Sans CJK TC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.5;padding:18px 18px 30px}
.wrap{max-width:1080px;margin:0 auto}
.out{background:#fff;border-radius:16px;padding:18px;display:grid;grid-template-columns:1fr 210px;gap:18px}
.out h2{font-size:19px;margin:0 0 10px}
.promptbox{border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:96px;font-size:15px;line-height:1.6;white-space:pre-wrap;color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.45}
.side{display:flex;flex-direction:column;gap:10px}
.pill{align-self:flex-start;background:var(--warn);color:#fff;border-radius:999px;padding:9px 16px;font-size:15px;font-weight:700}
.btn{font:inherit;font-weight:700;font-size:15px;min-height:42px;padding:12px 20px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.msg{font-size:14px;min-height:20px;font-weight:700;color:var(--ok)}
.msg.error{color:var(--error)}
@media(max-width:820px){body{padding:14px 12px 26px}.out{grid-template-columns:1fr;gap:12px;padding:14px}.side{flex-direction:row;flex-wrap:wrap;align-items:center}.out h2{font-size:21px}.msg{flex:1 0 100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="out">
    <div>
      <h2>可直接使用的 Prompt</h2>
      <div class="promptbox" id="promptBox"></div>
      <p class="note">這段 Prompt 會請 ChatGPT 用你剛才寫好的「每週會議上下文區塊」，找出 3 到 5 個適合交給 AI 工作流程改善的會前準備環節。</p>
    </div>
    <div class="side">
      <span class="pill">Prompt 已就緒</span>
      <button class="btn" id="copy" type="button">複製 Prompt</button>
      <button class="btn ghost" id="known" type="button">我已經知道了</button>
      <span class="msg" id="msg" aria-live="polite"></span>
    </div>
  </div>
</div>
<script>
(function(){
  var box=document.getElementById('promptBox'),copy=document.getElementById('copy'),known=document.getElementById('known'),msg=document.getElementById('msg');
  var PROMPT='請使用我的「每週會議上下文區塊」，從這套會前準備流程中，找出 3 到 5 個具體環節，是 AI 工作流程可以幫我改善的。這些環節要小到可以拿來練、風險低，而且在整門課裡都值得反覆回頭使用。每一個機會請說明：\n1. 它改善的是準備工作的哪一段\n2. 為什麼適合交給 AI 協助\n3. 可能需要哪些輸入\n4. 它可以產出什麼有用的内容。';
  box.textContent=PROMPT;
  function copyByTextarea(text){var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='0';ta.style.left='0';ta.style.width='1px';ta.style.height='1px';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{ta.setSelectionRange(0,ta.value.length)}catch(e){}var ok=false;try{ok=document.execCommand('copy')}catch(e){ok=false}document.body.removeChild(ta);return ok}
  function selectPrompt(){try{var r=document.createRange();r.selectNodeContents(box);var s=window.getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}
  function copied(){msg.className='msg';msg.textContent='已複製到剪貼簿。';copy.textContent='已複製';setTimeout(function(){copy.textContent='複製 Prompt'},1400)}
  function copyFailed(){selectPrompt();msg.className='msg error';msg.textContent='自動複製失敗，Prompt 已選取，請按 Ctrl/Cmd + C 複製。'}
  copy.addEventListener('click',function(){var text=box.textContent;msg.textContent='';if(copyByTextarea(text)){copied();return}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(copied).catch(copyFailed)}else{copyFailed()}});
  known.addEventListener('click',function(){msg.className='msg';msg.textContent='你可以直接複製上方 Prompt 貼到 ChatGPT。'});
})();
</script>
</body>
</html>
