<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>練習 1.4.3｜選定一個重點領域，產出工作流程雛型</title>
<style>
:root{--bg:#B9D2FF;--ink:#111;--muted:#5A6472;--line:#D7DCE5;--ok:#0F7B4F;--warn:#FF7A1A;--error:#C62828}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Noto Sans CJK TC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.5;padding:18px 18px 30px}
.wrap{max-width:1080px;margin:0 auto}
.row{display:grid;grid-template-columns:268px 1fr;gap:14px;margin-bottom:12px}
.label{background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:13px}
.num{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.label b{display:block;font-size:17px;line-height:1.25}
.label span{display:block;font-size:12.5px;line-height:1.35;color:#C9D3E2;margin-top:5px}
.field{background:#fff;border-radius:14px;padding:13px 14px 14px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.field textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;resize:vertical;min-height:72px}
.field textarea:focus{border-color:var(--ink);outline:0}
.field textarea::placeholder{color:#8B93A1}
.out{background:#fff;border-radius:16px;padding:18px;margin-top:4px;display:grid;grid-template-columns:1fr 210px;gap:18px}
.out h2{font-size:19px;margin:0 0 10px}
.promptbox{border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:96px;font-size:15px;line-height:1.6;white-space:pre-wrap;color:var(--ink)}
.promptbox.empty{color:#8B93A1}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.45}
.side{display:flex;flex-direction:column;gap:10px}
.pill{align-self:flex-start;background:#EFF2F7;color:var(--ink);border-radius:999px;padding:9px 16px;font-size:15px;font-weight:700}
.pill.done{background:var(--warn);color:#fff}
.btn{font:inherit;font-weight:700;font-size:15px;min-height:42px;padding:12px 20px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn[disabled]{background:#A8AEB8;border-color:#A8AEB8;color:#fff;cursor:default}
.msg{font-size:14px;min-height:20px;font-weight:700;color:var(--ok)}
.msg.error{color:var(--error)}
@media(max-width:820px){body{padding:14px 12px 26px}.row{grid-template-columns:168px 1fr;gap:10px}.label{padding:12px;gap:9px;border-radius:12px}.label b{font-size:18px}.label span{font-size:13px}.field textarea{font-size:15px;min-height:80px}.out{grid-template-columns:1fr;gap:12px;padding:14px}.side{flex-direction:row;flex-wrap:wrap;align-items:center}.out h2{font-size:21px}.msg{flex:1 0 100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div class="label">
      <div class="num">1</div>
      <div><b>重點領域</b><span>你想先以哪一個環節作為重點？</span></div>
    </div>
    <div class="field">
      <span>重點領域</span>
      <textarea id="focus" placeholder="範例：準備每週客戶回顧資料包、摘要顧客回饋，或改善交接紀錄"></textarea>
    </div>
  </div>
  <div class="out">
    <div>
      <h2>可直接使用的 Prompt</h2>
      <div class="promptbox empty" id="promptBox"></div>
      <p class="note">這段 Prompt 只會請 ChatGPT 產出一份工作流程的雛型大綱；完整的 AI 工作流程計畫會在後面的課程逐步建置。</p>
    </div>
    <div class="side">
      <span class="pill" id="pill">還有 1 欄未完成</span>
      <button class="btn" id="copy" type="button" disabled>複製 Prompt</button>
      <button class="btn ghost" id="reset" type="button">重設</button>
      <button class="btn ghost" id="known" type="button">我已經知道了</button>
      <span class="msg" id="msg" aria-live="polite"></span>
    </div>
  </div>
</div>
<script>
(function(){
  var focus=document.getElementById('focus'),box=document.getElementById('promptBox'),pill=document.getElementById('pill'),copy=document.getElementById('copy'),reset=document.getElementById('reset'),known=document.getElementById('known'),msg=document.getElementById('msg');
  function buildPrompt(v){return '請使用我的「每週會議上下文區塊」，以及這個重點領域：'+v+'，只先產出一份工作流程的雛型大綱。請包含：\n1. 一個可運作的目標\n2. 可能的輸入\n3. 可能的最終產出\n4. 3 到 5 個粗略階段\n5. 哪些地方可能需要人來審核\n現在還不要產出完整的工作流程計畫。我們會在整門課裡一步一步建置。'}
  function update(){var v=(focus.value||'').trim();if(v){box.textContent=buildPrompt(v);box.classList.remove('empty');pill.textContent='Prompt \u5df2\u5c31\u7dd2';pill.classList.add('done');copy.disabled=false}else{box.textContent='\u586b\u5165\u4f60\u7684\u91cd\u9ede\u9818\u57df\uff0c\u5c31\u6703\u7522\u751f\u53ef\u76f4\u63a5\u4f7f\u7528\u7684 Prompt\u3002';box.classList.add('empty');pill.textContent='\u9084\u6709 1 \u6b04\u672a\u5b8c\u6210';pill.classList.remove('done');copy.disabled=true}msg.textContent='';msg.className='msg'}
  function copyByTextarea(text){var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='0';ta.style.left='0';ta.style.width='1px';ta.style.height='1px';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{ta.setSelectionRange(0,ta.value.length)}catch(e){}var ok=false;try{ok=document.execCommand('copy')}catch(e){ok=false}document.body.removeChild(ta);return ok}
  function selectPrompt(){try{var r=document.createRange();r.selectNodeContents(box);var s=window.getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}
  function copied(){msg.className='msg';msg.textContent='\u5df2\u8907\u88fd\u5230\u526a\u8cbc\u7c3f\u3002';copy.textContent='\u5df2\u8907\u88fd';setTimeout(function(){copy.textContent='\u8907\u88fd Prompt'},1400)}
  function copyFailed(){selectPrompt();msg.className='msg error';msg.textContent='\u81ea\u52d5\u8907\u88fd\u5931\u6557\uff0cPrompt \u5df2\u9078\u53d6\uff0c\u8acb\u6309 Ctrl/Cmd + C \u8907\u88fd\u3002'}
  focus.addEventListener('input',update);
  copy.addEventListener('click',function(){if(copy.disabled)return;var text=box.textContent;msg.textContent='';if(copyByTextarea(text)){copied();return}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(copied).catch(copyFailed)}else{copyFailed()}});
  reset.addEventListener('click',function(){focus.value='';update();focus.focus()});
  known.addEventListener('click',function(){msg.className='msg';msg.textContent='\u5982\u679c\u4f60\u5df2\u7d93\u60f3\u597d\u91cd\u9ede\u9818\u57df\uff0c\u53ef\u4ee5\u76f4\u63a5\u8df3\u904e\u9019\u500b\u7df4\u7fd2\u3002'});
  update();
})();
</script>
</body>
</html>
