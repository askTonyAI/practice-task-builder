<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:'Noto Sans TC',Arial,sans-serif;margin:0;color:#111;background:#fff}.wrap{max-width:980px;margin:0 auto;padding:28px 32px}h1{font-size:28px;margin:0 0 8px}.small{color:#777;font-size:14px;margin:0 0 20px}.roles{display:flex;gap:10px;flex-wrap:wrap;border-bottom:1px solid #eee;padding-bottom:24px}.role{border:1px solid #ddd;border-radius:999px;background:#fff;padding:10px 18px;cursor:pointer;font-size:14px}.role.active{background:#000;color:#fff;border-color:#000}.card{margin-top:36px}.tag{display:inline-block;background:#f1f1f1;color:#777;border-radius:999px;padding:8px 14px;font-size:13px}.title{font-size:32px;margin:16px 0 8px}.prompt{font-size:19px;line-height:1.55;max-width:900px}.actions{margin-top:18px;display:flex;align-items:center;gap:12px}.btn{background:#f2f2f2;color:#111;border:0;border-radius:10px;padding:11px 15px;font-size:15px;cursor:pointer}.copied{color:#2783de;font-size:14px;display:none}@media(max-width:640px){.wrap{padding:22px 18px}.role{padding:9px 12px;font-size:13px}.title{font-size:27px}.prompt{font-size:17px}}</style></head><body><div class="wrap"><h1>選擇角色</h1><p class="small">選一個角色，看看每週回顧的分析段落可以怎麼規劃。</p><div class="roles" id="roles"></div><div class="card"><span class="tag">範例 prompt</span><div class="title" id="title"></div><div class="prompt" id="prompt"></div><div class="actions"><button class="btn" onclick="copyPrompt()">複製 prompt</button><span class="copied" id="copied">已複製</span></div></div></div><script>const data=[{en:'Sales',zh:'業務',base:'請幫我規劃每週銷售管線回顧與預測中的分析段落，我需要說明加權預測週比下降 [數字]%。'},{en:'Marketing',zh:'行銷',base:'請幫我規劃每週行銷活動回顧與下一步行動中的分析段落，我需要說明每條潛在客戶成本週比上升 [數字]%。'},{en:'Finance',zh:'財務',base:'請幫我規劃每週財務回顧與預測中的分析段落，我需要說明部門支出差異週比增加 [數字]%。'},{en:'Data Science',zh:'資料科學',base:'請幫我規劃每週洞察回顧與下一輪實驗中的分析段落，我需要說明實驗轉換提升週比下降 [數字]%。'}];let current=1;const roles=document.getElementById('roles'),title=document.getElementById('title'),prompt=document.getElementById('prompt'),copied=document.getElementById('copied');function render(){roles.innerHTML='';data.forEach((r,i)=>{const b=document.createElement('button');b.className='role'+(i===current?' active':'');b.textContent=r.en;b.onclick=()=>{current=i;copied.style.display='none';render()};roles.appendChild(b)});const r=data[current];title.textContent=r.zh;prompt.textContent=r.base;}async function copyPrompt(){try{await navigator.clipboard.writeText(data[current].base);copied.style.display='inline'}catch(e){alert('無法自動複製，請手動選取 prompt 文字。')}}render();</script></body></html>
