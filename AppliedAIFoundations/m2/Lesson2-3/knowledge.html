<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:'Noto Sans TC',Arial,sans-serif;background:#aecdff;color:#111}.wrap{max-width:980px;margin:0 auto;padding:22px 28px 28px}.inst{text-align:center;font-weight:700;font-style:italic;margin:0 0 26px}.game{display:grid;grid-template-columns:1fr 1fr;gap:18px 32px}.deck{grid-column:1/3;min-height:145px;display:flex;justify-content:center;align-items:center}.card{width:300px;min-height:118px;background:#fff;border-radius:3px;border-top:3px solid #111;box-shadow:0 1px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;text-align:center;padding:18px 22px;font-weight:700;line-height:1.45;cursor:grab;user-select:none;position:relative;transition:opacity .22s ease,transform .22s ease}.card:active{cursor:grabbing}.handle{font-size:20px;color:#777;margin-top:12px}.zone{height:190px;border:1.5px dashed #111;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-weight:800;position:relative;overflow:visible}.zone.over{background:rgba(255,255,255,.28)}.zone .label{font-size:18px}.zoneCard{position:absolute;width:300px;min-height:118px;background:#fff;border-radius:3px;border-top:3px solid #111;box-shadow:0 1px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;text-align:center;padding:18px 22px;font-weight:700;line-height:1.45}.zoneCard .handle{position:absolute;bottom:12px;left:0;right:0}.checkBubble{position:absolute;right:30px;top:24px;width:64px;height:64px;border:1.5px solid #9fc3f4;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#111;background:rgba(255,255,255,.05);animation:pop .36s ease both}.result{grid-column:1/3;text-align:center;font-size:22px;font-weight:800;min-height:32px}.replay{grid-column:1/3;text-align:center}.btn{border:0;border-top:1px solid rgba(0,0,0,.25);background:transparent;padding:12px 30px;font-weight:800;letter-spacing:.04em;cursor:pointer}.hidden{display:none}.fade{opacity:0;transform:scale(.96)}.shake{animation:shake .38s ease}@keyframes pop{0%{transform:scale(.65);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px) rotate(-1.5deg)}40%{transform:translateX(12px) rotate(1.5deg)}60%{transform:translateX(-8px) rotate(-1deg)}80%{transform:translateX(8px) rotate(1deg)}}@media(max-width:720px){.wrap{padding:18px}.game{gap:14px}.card,.zoneCard{width:240px}.zone{height:170px}.zone .label{font-size:16px}.checkBubble{right:18px;top:18px;width:54px;height:54px}}</style></head><body><div class="wrap"><p class="inst">請把每個任務拖到正確區域，或直接點你認為任務應該放入的區域。</p><div class="game"><div class="deck"><div class="card" id="card" draggable="true"><div><div id="cardText"></div><div class="handle">≡</div></div></div></div><div class="zone" data-zone="fast"><div class="label">比較快的模型</div></div><div class="zone" data-zone="reason"><div class="label">推理模型</div></div><div class="result" id="result"></div><div class="replay"><button class="btn hidden" id="replay">重新開始</button></div></div></div><script>const tasks=[{t:'為你的每週回顧段落寫一句快速標題',a:'fast'},{t:'比較 X% 週比變動的三種解釋',a:'reason'},{t:'把每週輸入的筆記整理成會議用的分階段大綱',a:'reason'},{t:'為你的對象寫一版一句話摘要初稿',a:'fast'},{t:'檢查你的建議草稿是否缺少假設',a:'reason'}];let i=0,score=0,busy=false;const card=document.getElementById('card'),cardText=document.getElementById('cardText'),result=document.getElementById('result'),replay=document.getElementById('replay'),zones=[...document.querySelectorAll('.zone')];function show(){busy=false;document.querySelectorAll('.zoneCard,.checkBubble').forEach(e=>e.remove());card.classList.remove('shake','fade');if(i>=tasks.length){card.classList.add('hidden');result.textContent=`${score}/${tasks.length} 張卡片正確`;replay.classList.remove('hidden');return}card.classList.remove('hidden');cardText.textContent=tasks[i].t;result.textContent=''}function makeZoneCard(zone){const zc=document.createElement('div');zc.className='zoneCard';zc.innerHTML=`<div><div>${tasks[i].t}</div><div class="handle">≡</div></div>`;zone.appendChild(zc);const chk=document.createElement('div');chk.className='checkBubble';chk.textContent='✓';zone.appendChild(chk);return zc}function answer(z){if(busy||i>=tasks.length)return;busy=true;const zone=document.querySelector(`[data-zone="${z}"]`);if(z===tasks[i].a){score++;card.classList.add('hidden');const zc=makeZoneCard(zone);setTimeout(()=>{zc.classList.add('fade');zone.querySelector('.checkBubble')?.classList.add('fade')},520);setTimeout(()=>{i++;show()},760)}else{card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');setTimeout(()=>{card.classList.remove('shake');busy=false},420)}}card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain','card')});zones.forEach(z=>{z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});z.addEventListener('dragleave',()=>z.classList.remove('over'));z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');answer(z.dataset.zone)});z.addEventListener('click',()=>answer(z.dataset.zone))});replay.onclick=()=>{i=0;score=0;result.textContent='';replay.classList.add('hidden');show()};show();</script></body></html>
