<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:'Noto Sans TC',Arial,sans-serif;background:#b9d8ff;color:#111}.wrap{max-width:980px;margin:0 auto;padding:16px}.panel{background:#fff;border-radius:5px;padding:18px}.head{display:grid;grid-template-columns:1fr 190px;gap:16px;align-items:start}.title{font-size:24px;font-weight:800;line-height:1.2;margin:0 0 12px}.actions{display:flex;flex-direction:column;gap:10px}.status{align-self:start;border-radius:999px;background:#ff7a1a;color:#fff;padding:10px 18px;font-size:14px;font-weight:800}.copy{border:0;border-radius:999px;background:#000;color:#fff;padding:15px 30px;font-size:15px;font-weight:800;cursor:pointer}.know{border:1px solid #ddd;border-radius:999px;background:#fff;padding:13px 24px;font-size:14px;cursor:pointer}.prompt{border:1px solid #ddd;border-radius:3px;padding:16px 18px;font-size:16px;line-height:1.55;white-space:pre-wrap;min-height:150px}.copied{display:none;color:#2783de;font-size:13px;font-weight:800;text-align:center}@media(max-width:760px){.head{grid-template-columns:1fr}.actions{flex-direction:row;flex-wrap:wrap}.status{align-self:center}}</style></head><body><div class="wrap"><div class="panel"><div class="head"><div><h2 class="title">可直接使用的 prompt</h2><div id="prompt" class="prompt">請為我的「每週會議工作流程包」建立一段簡短的推理筆記（Reasoning Note）。

請包含：
推理最能幫上忙的工作流程階段、
為什麼推理在這裡很有用、
我可以重複使用在這個階段的 prompt、
我需要自己確認的內容、
哪些地方需要人的判斷、
以及下週會議前我可以再修正什麼。</div></div><div class="actions"><span class="status">Prompt 可複製</span><button class="copy" id="copy">複製 prompt</button><span id="copied" class="copied">已複製</span><button class="know" id="know">我已經知道這個</button></div></div></div></div><script>const promptEl=document.getElementById('prompt');document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(promptEl.textContent);document.getElementById('copied').style.display='block'}catch(e){const r=document.createRange();r.selectNodeContents(promptEl);const s=window.getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');document.getElementById('copied').style.display='block'}};document.getElementById('know').onclick=()=>{};</script></body></html>
