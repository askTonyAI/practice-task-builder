<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:'Noto Sans TC',Arial,sans-serif;background:#b9d8ff;color:#111}.wrap{max-width:980px;margin:0 auto;padding:24px}.top{display:grid;grid-template-columns:270px 1fr;gap:16px;margin-bottom:14px}.step{background:#000;color:#fff;border-radius:5px;padding:28px 24px;display:flex;gap:18px;align-items:center}.num{background:#fff;color:#111;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}.step h2{margin:0 0 6px;font-size:24px;line-height:1.15}.step p{margin:0;font-size:14px;font-weight:700;line-height:1.35}.field{background:#fff;border-radius:5px;padding:12px}.label{font-size:13px;color:#555;margin-bottom:6px}textarea{box-sizing:border-box;width:100%;min-height:78px;border:1px solid #ddd;border-radius:3px;padding:12px;font-size:16px;line-height:1.5;font-family:inherit;resize:vertical}.panel{background:#fff;border-radius:5px;padding:18px 14px 16px}.panelHead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.panel h2{font-size:24px;line-height:1.2;margin:0}.actions{display:flex;gap:10px;align-items:center}.status{border-radius:999px;background:#eee;color:#555;padding:10px 18px;font-size:14px;font-weight:800}.status.ready{background:#ff7a1a;color:#fff}.copy{border:0;border-radius:999px;background:#aaa;color:#fff;padding:14px 30px;font-size:15px;font-weight:800;cursor:not-allowed}.copy.ready{background:#000;cursor:pointer}.main{display:grid;grid-template-columns:1fr 170px;gap:14px}.side{display:flex;flex-direction:column;gap:10px}.side button{border:1px solid #ddd;border-radius:999px;background:#fff;padding:12px 22px;font-size:14px;cursor:pointer}.prompt{min-height:154px;white-space:pre-wrap;border:1px solid #ddd;border-radius:3px;padding:14px;font-size:16px;line-height:1.5}.hint{font-size:13px;line-height:1.35;color:#666;margin-top:10px;max-width:760px}.copied{font-size:13px;color:#2783de;font-weight:800;display:none}@media(max-width:760px){.top{grid-template-columns:1fr}.panelHead{align-items:flex-start;flex-direction:column}.main{grid-template-columns:1fr}.actions{width:100%;justify-content:flex-start}.side{flex-direction:row;flex-wrap:wrap}}</style></head><body><div class="wrap"><div class="top"><div class="step"><div class="num">1</div><div><h2>大綱</h2><p>貼上你在模組 1 做好的大綱。</p></div></div><div class="field"><div class="label">大綱</div><textarea id="outline" placeholder="貼上你在模組 1 做好的大綱"></textarea></div></div><div class="panel"><div class="panelHead"><h2>可直接使用的 prompt</h2><div class="actions"><span id="status" class="status">完成 1 個欄位</span><button id="copy" class="copy" disabled>複製 prompt</button><span id="copied" class="copied">已複製</span></div></div><div class="main"><div id="prompt" class="prompt">貼上你在模組 1 做好的大綱，建立你的 prompt。</div><div class="side"><button id="reset">重設</button><button id="know">我已經知道這個</button></div></div><div class="hint">完成後的 prompt 會請 ChatGPT 選出推理模型最能增加價值的階段，接著替那個階段寫出更強的 prompt。</div></div></div><script>const outline=document.getElementById('outline'),promptBox=document.getElementById('prompt'),copyBtn=document.getElementById('copy'),statusEl=document.getElementById('status'),copied=document.getElementById('copied');function build(){const v=outline.value.trim();copied.style.display='none';if(!v){promptBox.textContent='貼上你在模組 1 做好的大綱，建立你的 prompt。';copyBtn.classList.remove('ready');copyBtn.disabled=true;statusEl.classList.remove('ready');statusEl.textContent='完成 1 個欄位';return}const p=`這是我目前每週會議工作流程的大綱：${v}\n\n請從這個工作流程中，選出一個最適合使用推理模型、也最能增加價值的階段。\n請說明為什麼這個階段需要仔細推理，而不是用比較快的回應就好。\n接著，請幫我替這個階段寫一段更強的 prompt。請包含：\n目標、\n上下文、\n限制條件、\n產出格式、\n以及我應該使用的檢查標準。`;promptBox.textContent=p;copyBtn.classList.add('ready');copyBtn.disabled=false;statusEl.classList.add('ready');statusEl.textContent='可以複製';}outline.addEventListener('input',build);copyBtn.addEventListener('click',async()=>{if(copyBtn.disabled)return;try{await navigator.clipboard.writeText(promptBox.textContent);copied.style.display='inline'}catch(e){const r=document.createRange();r.selectNodeContents(promptBox);const s=window.getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');copied.style.display='inline'}});document.getElementById('reset').onclick=()=>{outline.value='';build()};document.getElementById('know').onclick=()=>{};build();</script></body></html>
