<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色專屬能力反思</title>
<style>
:root{--bg:#dcc2ff;--ink:#111;--line:#d7d7d7;--white:#fff;--soft:#f5f5f5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:"Noto Sans TC","Noto Sans CJK TC",Arial,sans-serif;color:var(--ink)}body{padding:18px}.wrap{max-width:1180px;margin:0 auto}.tabs{display:flex;gap:10px;flex-wrap:wrap;background:#fff;border-radius:12px;padding:14px}.tab{min-height:44px;border:1.5px solid #cfcfcf;border-radius:999px;background:#fff;color:#111;padding:8px 22px;font-size:15px;font-weight:700;cursor:pointer}.tab.active{background:#000;color:#fff;border-color:#000}.content{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;margin-top:18px}.roleCard{min-height:360px;border-radius:10px;background:#000;color:#fff;padding:38px 28px;display:flex;flex-direction:column;justify-content:center}.roleCard h1{font-size:30px;line-height:1.2;margin:0 0 12px}.roleCard p{font-size:16px;line-height:1.45;margin:0}.details{display:grid;grid-template-columns:280px minmax(0,1fr);grid-template-rows:1fr 1fr;background:#fff;border-radius:10px;overflow:hidden;min-height:360px}.label{background:var(--soft);padding:28px 24px;display:flex;flex-direction:column;justify-content:center}.label:nth-of-type(3){border-top:1px solid var(--line)}.tag{align-self:flex-start;background:#000;color:#fff;border-radius:999px;padding:5px 13px;font-size:13px;margin-bottom:12px}.label h2{font-size:19px;line-height:1.35;margin:0}.text{padding:28px 30px;display:flex;align-items:center;font-size:18px;line-height:1.5}.text:nth-of-type(4){border-top:1px solid var(--line)}.tab:focus-visible{outline:3px solid #2783de;outline-offset:3px}@media(max-width:820px){body{padding:12px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}.tab{padding:8px 10px;font-size:14px}.content{grid-template-columns:1fr;gap:10px;margin-top:10px}.roleCard{min-height:170px;padding:24px}.roleCard h1{font-size:26px}.details{grid-template-columns:150px minmax(0,1fr);min-height:430px}.label{padding:20px 14px}.label h2{font-size:15px}.text{padding:20px 16px;font-size:15px}}@media(max-width:430px){.details{grid-template-columns:126px minmax(0,1fr)}.label{padding:16px 10px}.label h2{font-size:14px}.text{padding:16px 12px;font-size:14px}.roleCard p{font-size:15px}}
</style>
</head>
<body>
<main class="wrap">
<nav class="tabs" id="tabs" aria-label="選擇角色"></nav>
<section class="content" aria-live="polite">
<article class="roleCard"><h1 id="roleName"></h1><p>反思 ChatGPT 能協助你建立哪些結構，再與這個角色所需要的人類專業能力進行比較。</p></article>
<section class="details">
<div class="label"><span class="tag">ChatGPT</span><h2>值得反思的工作流程能力</h2></div><div class="text" id="workflow"></div>
<div class="label"><span class="tag">人類</span><h2>值得反思的專業能力</h2></div><div class="text" id="human"></div>
</section>
</section>
</main>
<script>
(function(){
var ROLES=[
{id:'sales',name:'業務',workflow:'將客戶紀錄、CRM 更新與業務管線資料整理成可重複使用的預測檢討工作流程；辨識交易風險；起草下一步摘要。',human:'關係判斷、談判、利害關係人意識、優先順序、商業直覺。'},
{id:'marketing',name:'行銷',workflow:'將行銷活動數據、受眾洞察與成效更新整理成可重複使用的行銷活動檢討工作流程；摘要成果；起草建議。',human:'品牌判斷、創意方向、受眾同理、策略定位、解讀微弱訊號。'},
{id:'data',name:'資料科學',workflow:'將實驗、儀表板、模型指標與資料品質訊號整理成可重複使用的洞察檢討工作流程；摘要研究發現與下一步實驗。',human:'科學懷疑精神、因果推理、統計判斷、優先順序、轉譯模糊資訊。'},
{id:'finance',name:'財務',workflow:'將實際數據、預測、差異資料與假設整理成可重複使用的財務檢討工作流程；摘要驅動因素與風險。',human:'財務判斷、假設驗證、商業解讀、風險評估、當責。'}
];
var current=0,tabs=document.getElementById('tabs'),name=document.getElementById('roleName'),workflow=document.getElementById('workflow'),human=document.getElementById('human');
ROLES.forEach(function(r,i){var b=document.createElement('button');b.type='button';b.className='tab';b.textContent=r.name;b.addEventListener('click',function(){current=i;render()});tabs.appendChild(b)});
function render(){var r=ROLES[current];name.textContent=r.name;workflow.textContent=r.workflow;human.textContent=r.human;Array.from(tabs.children).forEach(function(b,i){b.classList.toggle('active',i===current);b.setAttribute('aria-selected',i===current?'true':'false')})}render();
})();
</script>
</body>
</html>
