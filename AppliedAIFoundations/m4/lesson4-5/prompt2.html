<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>指令 2／3｜測試一個工作流程步驟</title><style>:root{--bg:#b9d2ff;--ink:#111;--muted:#5a6472;--border:#d7dce5;--disabled:#a8aeb8;--green:#0f7b4f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:"Noto Sans TC","Noto Sans CJK TC",Arial,sans-serif;color:var(--ink)}body{padding:18px}.wrap{max-width:1080px;margin:auto}.row{display:grid;grid-template-columns:268px 1fr;gap:14px;margin-bottom:12px}.label{min-height:178px;background:#000;color:#fff;border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:16px}.num{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:17px;font-weight:800}.label b{display:block;font-size:17px;line-height:1.25}.label div>span{display:block;margin-top:6px;font-size:12.5px;line-height:1.35;color:#c9d3e2}.field{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 14px}.field>span{display:block;margin-bottom:8px;font-size:12.5px;color:var(--muted);font-weight:700}.field textarea{width:100%;min-height:125px;resize:vertical;border:2px solid #111;border-radius:10px;padding:11px 12px;font:15px/1.5 inherit}.out{display:grid;grid-template-columns:1fr 200px;gap:16px;background:#fff;border-radius:16px;padding:16px 18px}.out h1{font-size:19px;margin:0 0 10px}.prompt{min-height:128px;border:1px solid var(--border);border-radius:10px;padding:16px 18px;font-size:15px;line-height:1.6;white-space:pre-wrap}.prompt.empty{color:var(--muted)}.note{margin:10px 0 0;color:var(--muted);font-size:13px}.side{display:flex;flex-direction:column;gap:10px}.pill{display:flex;align-items:center;justify-content:center;min-height:38px;padding:7px 16px;border-radius:999px;background:#ececec;font-size:13.5px;font-weight:800}.pill.ready{background:#e8f1ec;color:var(--green)}.btn{min-height:42px;border:2px solid #111;border-radius:999px;padding:8px 18px;background:#fff;color:#111;font-size:15px;font-weight:800;cursor:pointer}.btn.primary{background:#111;color:#fff}.btn:disabled{border-color:var(--disabled);background:var(--disabled);color:#fff;cursor:not-allowed}.msg{min-height:20px;color:var(--green);font-size:13.5px;font-weight:700;text-align:center}.btn:focus-visible,textarea:focus-visible,.prompt:focus-visible{outline:3px solid #2783de;outline-offset:3px}@media(max-width:820px){body{padding:14px 12px}.row{grid-template-columns:168px 1fr;gap:10px}.label{padding:10px 12px;min-height:190px;border-radius:12px}.num{width:30px;height:30px;font-size:13px}.label b{font-size:14.5px}.label div>span{font-size:11.5px}.field textarea{font-size:14px;min-height:136px}.out{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.side .pill,.side .msg{grid-column:1/-1}.prompt{min-height:185px;font-size:14px}}</style></head><body><main class="wrap"><section class="row"><div class="label"><span class="num">1</span><div><b>選擇你的工作流程步驟</b><span>輸入你希望 ChatGPT 協助執行的一個步驟。</span></div></div><label class="field"><span>工作流程步驟</span><textarea id="input" placeholder="例如：為這項活動擬定學員操作說明"></textarea></label></section><section class="out"><div><h1>可直接使用的指令</h1><div class="prompt empty" id="prompt" tabindex="0">在上方輸入工作流程步驟，系統就會替你組合指令。</div><p class="note">完成後的指令能讓 ChatGPT 一次只專注於一個工作流程步驟。</p></div><div class="side"><span class="pill" id="status">完成 1 個部分</span><button class="btn primary" id="copy" type="button" disabled>複製指令</button><button class="btn" id="reset" type="button">清空重填</button><button class="btn" id="known" type="button">我已經知道這個內容</button><span class="msg" id="msg" role="status" aria-live="polite"></span></div></section></main><script>(function(){var input=document.getElementById('input'),box=document.getElementById('prompt'),copy=document.getElementById('copy'),reset=document.getElementById('reset'),known=document.getElementById('known'),status=document.getElementById('status'),msg=document.getElementById('msg'),timer;function build(v){return v.trim()?'請協助我執行工作流程中的這一個步驟：'+v.trim()+'。\n\n請只專注於這個步驟，並使用我接下來提供的最新資料完成。不要延伸到其他工作流程步驟；如果缺少必要資訊，請先指出需要我補充的內容。':''}function refresh(){var out=build(input.value);if(out){box.textContent=out;box.classList.remove('empty');copy.disabled=false;status.textContent='已完成 1／1';status.classList.add('ready')}else{box.textContent='在上方輸入工作流程步驟，系統就會替你組合指令。';box.classList.add('empty');copy.disabled=true;status.textContent='完成 1 個部分';status.classList.remove('ready')}}function selectText(){var r=document.createRange();r.selectNodeContents(box);var s=window.getSelection();s.removeAllRanges();s.addRange(r);box.focus()}async function doCopy(){var text=box.textContent.trim(),ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true}}catch(e){}if(!ok){var t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.focus();t.select();try{ok=document.execCommand('copy')}catch(e){ok=false}t.remove()}clearTimeout(timer);if(ok){copy.textContent='已複製';msg.textContent='已複製';timer=setTimeout(function(){copy.textContent='複製指令';msg.textContent=''},1400)}else{selectText();msg.textContent='無法自動複製，請手動複製已選取的文字。'}}input.addEventListener('input',refresh);copy.addEventListener('click',doCopy);reset.addEventListener('click',function(){input.value='';refresh();input.focus()});known.addEventListener('click',function(){known.textContent='已標記';known.disabled=true;msg.textContent='已記錄。'});refresh()})();</script></body></html>
