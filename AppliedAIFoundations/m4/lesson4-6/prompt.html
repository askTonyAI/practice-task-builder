<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>使用每週發布準備度簡報技能</title><style>:root{--bg:#b9d2ff;--ink:#111;--border:#d7dce5;--orange:#ff7a12;--green:#0f7b4f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:"Noto Sans TC","Noto Sans CJK TC",Arial,sans-serif;color:var(--ink)}body{padding:18px}.wrap{max-width:1080px;margin:auto}.panel{background:#fff;border-radius:14px;padding:20px;border:1px solid rgba(0,0,0,.08)}.top{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;margin-bottom:16px}h1{font-size:21px;margin:0}.pill{background:var(--orange);color:#fff;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:800}.btn{min-height:44px;border:2px solid #111;border-radius:999px;padding:8px 22px;background:#111;color:#fff;font-size:15px;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:#111}.prompt{min-height:148px;border:1px solid var(--border);border-radius:10px;padding:18px 20px;font-size:16px;line-height:1.62;white-space:pre-wrap}.actions{display:flex;justify-content:flex-end;margin-top:14px}.msg{min-height:22px;text-align:right;color:var(--green);font-size:13.5px;font-weight:700}.btn:focus-visible,.prompt:focus-visible{outline:3px solid #2783de;outline-offset:3px}@media(max-width:820px){body{padding:14px 12px}.panel{padding:16px}.top{grid-template-columns:1fr auto}.top h1{grid-column:1/-1}.prompt{min-height:210px;font-size:14px}.actions .btn{width:100%}}</style></head><body><main class="wrap"><section class="panel"><div class="top"><h1>可直接使用的指令</h1><span class="pill">指令已就緒</span><button class="btn" id="copy" type="button">複製指令</button></div><div class="prompt" id="prompt" tabindex="0">請使用我的「每週發布準備度簡報」技能，協助我準備本週的審查。請提供一小部分安全、可分享的本週輸入資料樣本。</div><div class="actions"><button class="btn secondary" id="known" type="button">我已經知道這個內容</button></div><div class="msg" id="msg" role="status" aria-live="polite"></div></section></main><script>(function(){var box=document.getElementById('prompt'),copy=document.getElementById('copy'),known=document.getElementById('known'),msg=document.getElementById('msg'),timer;function selectText(){var r=document.createRange();r.selectNodeContents(box);var s=window.getSelection();s.removeAllRanges();s.addRange(r);box.focus()}async function doCopy(){var text=box.textContent.trim(),ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true}}catch(e){}if(!ok){var t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.focus();t.select();try{ok=document.execCommand('copy')}catch(e){ok=false}t.remove()}clearTimeout(timer);if(ok){copy.textContent='已複製';msg.textContent='已複製';timer=setTimeout(function(){copy.textContent='複製指令';msg.textContent=''},1400)}else{selectText();msg.textContent='無法自動複製，請手動複製已選取的文字。'}}copy.addEventListener('click',doCopy);known.addEventListener('click',function(){known.textContent='已標記';known.disabled=true;msg.textContent='已記錄。'})})();</script></body></html>
