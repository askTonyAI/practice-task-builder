<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>練習：負責任使用檢查｜指令產生器</title><style>
:root{--bg:#B9D2FF;--ink:#111;--muted:#5A6472;--line:#D7DCE5;--ok:#0F7B4F;--warn:#FF7A1A}*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Noto Sans CJK TC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.5;padding:18px 18px 30px}.wrap{max-width:1080px;margin:0 auto}.row{display:grid;grid-template-columns:268px 1fr;gap:14px;margin-bottom:12px}.label{background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:13px}.num{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}.label b{display:block;font-size:17px;line-height:1.25}.label span{display:block;font-size:12.5px;line-height:1.35;color:#C9D3E2;margin-top:5px}.field{background:#fff;border-radius:14px;padding:13px 14px 14px}.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}.field textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;resize:vertical;min-height:72px}.field textarea:focus{border-color:var(--ink);outline:0}.out{background:#fff;border-radius:16px;padding:18px;margin-top:4px;display:grid;grid-template-columns:1fr 210px;gap:18px}.out h2{font-size:19px;margin:0 0 10px}.promptbox{border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:96px;font-size:15px;line-height:1.6;white-space:pre-wrap;color:var(--ink)}.promptbox.empty{color:#8B93A1}.note{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.45}.side{display:flex;flex-direction:column;gap:10px}.pill{align-self:flex-start;background:#EFF2F7;color:var(--ink);border-radius:999px;padding:9px 16px;font-size:15px;font-weight:700}.pill.done{background:var(--warn);color:#fff}.btn{font:inherit;font-weight:700;font-size:15px;min-height:42px;padding:12px 20px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}.btn[disabled]{background:#A8AEB8;border-color:#A8AEB8;color:#fff;cursor:default}.msg{font-size:14px;min-height:20px;font-weight:700;color:var(--ok)}@media(max-width:820px){body{padding:14px 12px 26px}.row{grid-template-columns:168px 1fr;gap:10px}.label{padding:12px;gap:9px;border-radius:12px}.num{width:32px;height:32px;font-size:16px}.label b{font-size:18px}.label span{font-size:13px}.field textarea{font-size:15px;min-height:80px}.out{grid-template-columns:1fr;gap:12px;padding:14px}.side{flex-direction:row;flex-wrap:wrap;align-items:center}.btn{font-size:15px;min-height:42px}.out h2{font-size:21px}}
</style></head><body><div class="wrap"><div class="row"><div class="label"><div class="num">1</div><div><b>描述任務</b><span>寫下你正在考慮是否要用 ChatGPT 處理的任務。</span></div></div><div class="field"><span>描述任務</span><textarea id="task" placeholder="範例：草擬客戶專案更新、檢查試算表公式，或摘要政策文件"></textarea></div></div><div class="out"><div><h2>可直接使用的 Prompt</h2><div class="promptbox" id="promptBox"></div><p class="note">完成後的 prompt 會請 ChatGPT 先檢查任務適合度、資訊分享與人為審核，再建議你是否適合使用 ChatGPT、加上防護措施，或讓人與核准流程主導。</p></div><div class="side"><span class="pill done" id="pill">Ready to copy</span><button class="btn" id="copy" type="button">複製 Prompt</button><button class="btn ghost" id="reset" type="button">重設</button><button class="btn ghost" id="demo" type="button">我已經知道了</button><span class="msg" id="msg"></span></div></div></div><script>(function(){var task=document.getElementById('task'),box=document.getElementById('promptBox'),pill=document.getElementById('pill'),copy=document.getElementById('copy'),reset=document.getElementById('reset'),demo=document.getElementById('demo'),msg=document.getElementById('msg');function clean(v){return(v||'').trim()}function update(){var v=clean(task.value);if(v){box.textContent='我正在考慮用 ChatGPT 處理這個任務：'+v+'。請用三項檢查協助我評估：任務是否適合、資訊分享是否只包含必要且被允許的內容，以及使用前需要多仔細的人為審核。請先向我提出你需要釐清的問題，接著建議我應該使用 ChatGPT、加上防護措施後使用，或讓人與經核准的流程主導。';box.classList.remove('empty');pill.textContent='Ready to copy';pill.classList.add('done');copy.disabled=false}else{box.textContent='描述任務來建立你的 prompt。';box.classList.add('empty');pill.textContent='Complete 1 part';pill.classList.remove('done');copy.disabled=true}msg.textContent=''}task.addEventListener('input',update);copy.addEventListener('click',async function(){if(copy.disabled)return;try{await navigator.clipboard.writeText(box.textContent);msg.textContent='已複製';copy.textContent='已複製';setTimeout(function(){copy.textContent='複製 Prompt'},1200)}catch(e){var r=document.createRange();r.selectNodeContents(box);var s=window.getSelection();s.removeAllRanges();s.addRange(r);msg.textContent='已選取文字，請手動複製'}});reset.addEventListener('click',function(){task.value='';update()});demo.addEventListener('click',function(){msg.textContent='你可以直接複製上方 Prompt 貼到 ChatGPT。'});update();})();</script></body></html>
