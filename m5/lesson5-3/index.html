<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;font-family:'Noto Sans TC',Arial,sans-serif;overflow:hidden}.wrap{width:100%;padding:10px}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.card{position:relative;height:360px;border:1px solid #d8d8d8;background:#fafafa;display:flex;align-items:center;justify-content:center;padding:28px;cursor:pointer;user-select:none}.refresh{position:absolute;right:14px;top:12px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(255,255,255,.85);font-weight:700}.front{text-align:center}.icon{width:92px;height:92px;margin:0 auto 36px}.pill{display:inline-block;min-width:190px;border-radius:999px;color:#fff;font-size:30px;font-weight:900;padding:10px 28px;line-height:1}.less{background:#f2484f}.safe{background:#51d34d}.back{display:none;width:100%;font-size:24px;line-height:1.35;font-weight:500}.card.flipped .front{display:none}.card.flipped .back{display:block}.hint{text-align:center;color:#777;font-size:14px;margin-top:6px}</style></head><body><div class="wrap"><div class="grid"><section class="card" onclick="this.classList.toggle('flipped')"><div class="refresh">↻</div><div class="front"><svg class="icon" viewBox="0 0 120 120" fill="none" stroke="#000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="M60 10 104 35v50L60 110 16 85V35L60 10Z"/><path d="M60 34v36"/><circle cx="60" cy="88" r="2" fill="#000" stroke="#000"/></svg><div class="pill less">較不安全</div></div><div class="back">請改寫這則要給員工 Maria Gomez 的訊息，內容要包含她的績效、精確分數，以及這裡列出的問題。</div></section><section class="card" onclick="this.classList.toggle('flipped')"><div class="refresh">↻</div><div class="front"><svg class="icon" viewBox="0 0 120 120" fill="none" stroke="#000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="M26 14h68a8 8 0 0 1 8 8v46c0 22-18 36-42 46-24-10-42-24-42-46V22a8 8 0 0 1 8-8Z"/><path d="M36 60l17 17 34-34"/></svg><div class="pill safe">較安全</div></div><div class="back">請草擬一份通用範本，用來給員工績效回饋。語氣請保持清楚、尊重且具建設性。具體細節我會之後自己補上。</div></section></div><div class="hint">點選卡片可切換正反面</div></div></body></html>
