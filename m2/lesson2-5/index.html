<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>練習：上下文｜指令產生器</title>
<style>
  :root {
    --bg: #B9D2FF;
    --ink: #111111;
    --muted: #5A6472;
    --line: #D7DCE5;
    --ok: #0F7B4F;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "Noto Sans CJK TC", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 16px; line-height: 1.5;
    padding: 18px 18px 30px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  .nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 0 0 14px; }
  .nav h1 { font-size: 21px; margin: 0; letter-spacing: -0.3px; }
  .navbtn {
    font: inherit; font-size: 14px; font-weight: 700;
    background: #fff; color: var(--ink);
    border: 2px solid var(--ink); border-radius: 999px;
    padding: 6px 16px; min-height: 36px; cursor: pointer;
  }
  .navbtn[disabled] { opacity: .35; cursor: default; }
  .navbtn:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #1B3A6B; outline-offset: 2px; }

  .row { display: grid; grid-template-columns: 268px 1fr; gap: 14px; margin-bottom: 8px; }
  .label {
    background: var(--ink); color: #fff; border-radius: 14px;
    padding: 12px 16px; display: flex; align-items: center; gap: 13px;
  }
  .num {
    flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%;
    background: #fff; color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px;
  }
  .label b { display: block; font-size: 17px; line-height: 1.25; }
  .label span { display: block; font-size: 12.5px; line-height: 1.35; color: #C9D3E2; margin-top: 3px; }

  .field { background: #fff; border-radius: 14px; padding: 11px 14px 13px; }
  .field > span { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  .field input, .field textarea {
    width: 100%; font: inherit; font-size: 15px; color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px; background: #fff; resize: vertical;
  }
  .field textarea { min-height: 64px; border-width: 2px; border-color: var(--ink); }
  .field input::placeholder, .field textarea::placeholder { color: #8B93A1; }

  .out {
    background: #fff; border-radius: 16px; padding: 16px 18px; margin-top: 4px;
    display: grid; grid-template-columns: 1fr 200px; gap: 18px;
  }
  .out h2 { font-size: 19px; margin: 0 0 10px; }
  .promptbox {
    border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; min-height: 88px;
    font-size: 15px; line-height: 1.6; white-space: pre-wrap;
    color: var(--ink);
  }
  .promptbox.empty { color: #8B93A1; }
  .note { font-size: 13px; color: var(--muted); margin: 9px 0 0; }
  .side { display: flex; flex-direction: column; gap: 9px; }
  .pill {
    align-self: flex-start; background: #EFF2F7; color: var(--ink);
    border-radius: 999px; padding: 6px 14px; font-size: 13.5px; font-weight: 700;
  }
  .pill.done { background: #DDF3E7; color: var(--ok); }
  .btn {
    font: inherit; font-weight: 700; font-size: 15px;
    min-height: 42px; padding: 9px 18px; border-radius: 999px;
    border: 2px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer;
  }
  .btn.ghost { background: #fff; color: var(--ink); }
  .btn[disabled] { background: #A8AEB8; border-color: #A8AEB8; color: #fff; cursor: default; }
  .msg { font-size: 13.5px; min-height: 20px; font-weight: 700; color: var(--ok); }

  @media (max-width: 820px) {
    body { padding: 14px 12px 26px; }
    .row { grid-template-columns: 168px 1fr; gap: 10px; }
    .label { padding: 10px 12px; gap: 9px; border-radius: 12px; }
    .num { width: 26px; height: 26px; font-size: 13px; }
    .label b { font-size: 14.5px; }
    .label span { font-size: 11.5px; }
    .field { padding: 9px 11px 11px; border-radius: 12px; }
    .field input, .field textarea { font-size: 14px; padding: 8px 10px; }
    .field textarea { min-height: 64px; }
    .out { grid-template-columns: 1fr; gap: 12px; padding: 14px; }
    .side { flex-direction: row; flex-wrap: wrap; align-items: center; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <button class="navbtn" id="prev" type="button">← 上一個</button>
    <h1 id="title">指令練習 1／2</h1>
    <button class="navbtn" id="next" type="button">下一個 →</button>
  </div>

  <div id="rows"></div>

  <div class="out">
    <div>
      <h2>可直接使用的指令</h2>
      <div class="promptbox empty" id="promptBox"></div>
      <p class="note" id="note"></p>
    </div>
    <div class="side">
      <span class="pill" id="pill">已填 0／1</span>
      <button class="btn" id="copy" type="button" disabled>複製指令</button>
      <button class="btn ghost" id="reset" type="button">清空重填</button>
      <button class="btn ghost" id="demo" type="button">看示範填答</button>
      <span class="msg" id="msg"></span>
    </div>
  </div>
</div>

<script>
(function () {
  var STAGES = [
    {
      title: "指令練習 1／2",
      note: "完成後的指令，會把你的任務變成一句清楚的起手指令。",
      fields: [
        {
          key: "task", type: "textarea",
          heading: "描述你的任務", sub: "你想用 ChatGPT 練習什麼？",
          label: "任務", placeholder: "描述你想用 ChatGPT 練習的任務"
        }
      ]
    },
    {
      title: "指令練習 2／2",
      note: "完成後的指令，會把任務、目標、對象、用途與關鍵細節組合在一起。",
      fields: [
        {
          key: "task", type: "textarea",
          heading: "描述任務", sub: "你想用 ChatGPT 練習什麼？",
          label: "任務", placeholder: "描述你想用 ChatGPT 練習的任務"
        },
        {
          key: "goal", type: "input",
          heading: "設定目標", sub: "完成的回覆要幫你達成什麼？",
          label: "目標", placeholder: "例如：讓內容更清楚、節省時間、產出一份可用的初稿"
        },
        {
          key: "audience", type: "input",
          heading: "選擇對象", sub: "這份產出是寫給誰看的？",
          label: "對象", placeholder: "例如：客戶、學員、主管、同事"
        },
        {
          key: "use", type: "input",
          heading: "加上用途", sub: "告訴 ChatGPT 這份產出要用在哪裡。",
          label: "用途", placeholder: "例如：寫一封信、規劃一場課程、摘要資訊"
        },
        {
          key: "details", type: "textarea",
          heading: "補上具體細節", sub: "要包含哪些段落、要求或必談的重點。",
          label: "指定段落或細節", placeholder: "加入任何你希望被包含的段落、細節、要求或重點"
        }
      ]
    }
  ];

  var DEMO = {
    task: "幫我寫一封給旅客的行程確認信",
    goal: "讓客人一眼看懂出發資訊，減少行前來回詢問",
    audience: "即將出團的散客旅客",
    use: "用 Email 在出發前三天寄給客人",
    details: "包含集合時間與地點、航班資訊、行李規定、緊急聯絡電話；語氣親切但簡潔，控制在 300 字以內"
  };

  var state = { stage: 0, values: { 0: {}, 1: {} } };

  var rowsEl = document.getElementById("rows");
  var titleEl = document.getElementById("title");
  var noteEl = document.getElementById("note");
  var boxEl = document.getElementById("promptBox");
  var pillEl = document.getElementById("pill");
  var msgEl = document.getElementById("msg");
  var copyBtn = document.getElementById("copy");
  var resetBtn = document.getElementById("reset");
  var demoBtn = document.getElementById("demo");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");

  function vals() { return state.values[state.stage]; }

  function render() {
    var stage = STAGES[state.stage];
    titleEl.textContent = stage.title;
    noteEl.textContent = stage.note;
    prevBtn.disabled = state.stage === 0;
    nextBtn.disabled = state.stage === STAGES.length - 1;
    rowsEl.innerHTML = "";

    stage.fields.forEach(function (f, i) {
      var row = document.createElement("div");
      row.className = "row";

      var label = document.createElement("div");
      label.className = "label";
      var num = document.createElement("div");
      num.className = "num";
      num.textContent = String(i + 1);
      var txt = document.createElement("div");
      var b = document.createElement("b");
      b.textContent = f.heading;
      var s = document.createElement("span");
      s.textContent = f.sub;
      txt.appendChild(b);
      txt.appendChild(s);
      label.appendChild(num);
      label.appendChild(txt);

      var field = document.createElement("div");
      field.className = "field";
      var cap = document.createElement("span");
      cap.textContent = f.label;
      var input = document.createElement(f.type === "textarea" ? "textarea" : "input");
      input.placeholder = f.placeholder;
      input.value = vals()[f.key] || "";
      input.addEventListener("input", function () {
        vals()[f.key] = input.value;
        update();
      });
      field.appendChild(cap);
      field.appendChild(input);

      row.appendChild(label);
      row.appendChild(field);
      rowsEl.appendChild(row);
    });

    update();
  }

  function clean(text) {
    return (text || "").trim().replace(/[。\.]+$/, "");
  }

  function buildPrompt() {
    var v = vals();
    var task = clean(v.task);
    if (!task) return "";

    if (state.stage === 0) {
      return "我想請你幫我完成這件事：" + task + "。\n" +
        "在開始之前，如果有你需要知道、但我還沒說明的資訊，請先問我。";
    }

    var lines = ["我想請你幫我完成這件事：" + task + "。"];
    if (clean(v.goal)) lines.push("這份產出的目標是：" + clean(v.goal) + "。");
    if (clean(v.audience)) lines.push("閱讀對象是：" + clean(v.audience) + "。");
    if (clean(v.use)) lines.push("它會被用在：" + clean(v.use) + "。");
    if (clean(v.details)) lines.push("請務必包含：" + clean(v.details) + "。");
    lines.push("完稿之前，如果有你需要知道、但我還沒說明的細節，請先問我。");
    return lines.join("\n");
  }

  function update() {
    var stage = STAGES[state.stage];
    var total = stage.fields.length;
    var filled = stage.fields.filter(function (f) { return clean(vals()[f.key]); }).length;

    pillEl.textContent = "已填 " + filled + "／" + total;
    pillEl.className = filled === total ? "pill done" : "pill";

    var text = buildPrompt();
    if (text) {
      boxEl.textContent = text;
      boxEl.className = "promptbox";
    } else {
      boxEl.textContent = total === 1
        ? "先在上面描述你的任務，指令就會出現在這裡。"
        : "把上面的欄位填起來，指令就會出現在這裡。";
      boxEl.className = "promptbox empty";
    }
    copyBtn.disabled = !text;
    msgEl.textContent = "";
  }

  function copyPrompt() {
    var text = buildPrompt();
    if (!text) return;
    var done = function () { msgEl.textContent = "已複製，貼到 ChatGPT 試試看。"; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); }
      catch (err) { msgEl.textContent = "請手動選取複製。"; }
      document.body.removeChild(ta);
    }
  }

  copyBtn.addEventListener("click", copyPrompt);
  resetBtn.addEventListener("click", function () {
    state.values[state.stage] = {};
    render();
  });
  demoBtn.addEventListener("click", function () {
    var v = {};
    STAGES[state.stage].fields.forEach(function (f) { v[f.key] = DEMO[f.key]; });
    state.values[state.stage] = v;
    render();
    msgEl.textContent = "這是示範，改成你自己的內容更有用。";
  });
  prevBtn.addEventListener("click", function () {
    if (state.stage > 0) { state.stage--; render(); }
  });
  nextBtn.addEventListener("click", function () {
    if (state.stage < STAGES.length - 1) { state.stage++; render(); }
  });

  render();
})();
</script>
</body>
</html>
